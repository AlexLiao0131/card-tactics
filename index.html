<script>
/* V10.11.58：固定 Boss 目標 + 任務錨定課表科目 + 核定後才計入達成率。
   每日小怪 calibratedDailyMonsterPower 與已建立的普通副本完全不變。 */
(function(){
  const DEFAULT_SUBJECTS=[
    {id:'chinese',name:'國語'},
    {id:'english',name:'英語'},
    {id:'math',name:'數學'}
  ];
  const LEARNING_CATEGORIES=new Set(['study','exam_paper','school_reading']);
  const POWER_WEIGHT={str:1.2,agi:1.1,int:1.0,will:.8,virtue:0};
  function escapeHtml(value){
    return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function ensureExamBossConfig(){
    if(!familyData.examSubjects||!Array.isArray(familyData.examSubjects))familyData.examSubjects=DEFAULT_SUBJECTS.map(x=>({...x}));
    if(!familyData.examSubjects.length)familyData.examSubjects=DEFAULT_SUBJECTS.map(x=>({...x}));
    familyData.examSubjects.forEach(s=>{s.id=s.id||uid();s.name=(s.name||'未命名科目').trim();});
    if(!Array.isArray(familyData.schoolTimetable))familyData.schoolTimetable=[];
    familyData.schoolTimetable.forEach(x=>{x.id=x.id||uid();x.weekday=Number(x.weekday)||1;x.minutes=Math.max(1,Number(x.minutes)||40);});
    if(!gameData.examBossBaselineV10158){
      // combatPower() 只讀角色四維，不含任何裝備數值。
      gameData.examBossBaselineV10158={date:today(),nakedPower:Math.max(1,combatPower()),createdAt:new Date().toISOString()};
    }
    (gameData.tasks||[]).forEach(t=>{
      if(t.courseId===undefined){
        const raw=String(t.subject||'').trim().toLowerCase();
        const found=familyData.examSubjects.find(s=>s.name.trim().toLowerCase()===raw);
        t.courseId=found?.id||'';
      }
    });
  }
  window.ensureExamBossConfig=ensureExamBossConfig;
  ensureExamBossConfig();

  // V10.11.61：舊學期事件只搬一次到冒險行事曆；之後所有日期判斷只讀單一事件來源。
  function migrateLegacySemesterEvents(){
    ensureAdventureCalendar();
    if(familyData.calendarUnifiedV101161)return false;
    const legacy=[...(gameData.semester?.events||[]),...(gameData.events||[])];
    let changed=false;
    legacy.forEach(e=>{
      if(!e?.date||!['holiday','midterm','final','special'].includes(e.type))return;
      const type=e.type==='special'?'activity':e.type;
      if(familyData.adventureCalendar.some(x=>x.date===e.date&&x.type===type))return;
      familyData.adventureCalendar.push({id:uid(),date:e.date,name:e.name||type,type,
        examSubjectIds:['midterm','final'].includes(type)?familyData.examSubjects.map(s=>s.id):[],
        allDay:true,startTime:'',endTime:'',note:'由舊學期事件自動合併',reminderMinutes:0,
        targetType:'all',targetProfileIds:[],requireComplete:false,completedBy:{},
        creatorRole:'parent',creatorProfileId:'parent'});
      changed=true;
    });
    familyData.calendarUnifiedV101161=true;
    if(changed)try{persistCalendarChange();}catch(e){}
    return changed;
  }
  migrateLegacySemesterEvents();

  window.examSubjectOptionsHTML=function(){
    ensureExamBossConfig();
    return familyData.examSubjects.map(s=>`<option value="${escapeHtml(s.name)}"></option>`).join('');
  };
  window.examCourseTaskOptionsHTML=function(selected=''){
    ensureExamBossConfig();
    return familyData.examSubjects.map(s=>`<option value="${s.id}" ${selected===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  };
  window.examCourseTaskSelectHTML=function(t){
    ensureExamBossConfig();
    return `<label class="small">Boss 考科連結</label><select onchange="gmLinkTaskCourse('${t.id}',this.value)"><option value="" ${!t.courseId?'selected':''}>未指定（學習類平均分配）</option>${examCourseTaskOptionsHTML(t.courseId||'')}</select>`;
  };
  window.gmLinkTaskCourse=function(taskId,courseId){
    const t=(gameData.tasks||[]).find(x=>x.id===taskId);if(!t)return;
    const c=familyData.examSubjects.find(x=>x.id===courseId);t.courseId=c?.id||'';t.subject=c?.name||'';
    relockAllExamBosses('task-course-link');saveGame();renderGM();
  };
  window.examSubjectCheckboxesHTML=function(selected=[]){
    ensureExamBossConfig();
    const use=selected.length?selected:familyData.examSubjects.map(s=>s.id);
    return `<div class="weekday-grid">${familyData.examSubjects.map(s=>`<label><input class="gmExamSubject" type="checkbox" value="${s.id}" ${use.includes(s.id)?'checked':''}>${escapeHtml(s.name)}</label>`).join('')}</div>`;
  };
  window.toggleExamSubjectPicker=function(){
    const box=document.getElementById('gmExamSubjects'),type=document.getElementById('gmCalType')?.value;
    if(box)box.style.display=['midterm','final'].includes(type)?'block':'none';
  };
  window.examSubjectScheduleGMHTML=function(){
    ensureExamBossConfig();
    const days=['日','一','二','三','四','五','六'];
    const subjectRows=familyData.examSubjects.map(s=>`<span class="pill">${escapeHtml(s.name)} <button class="btn red" style="padding:2px 7px" onclick="gmDeleteExamSubject('${s.id}')">×</button></span>`).join(' ');
    const schedule=familyData.schoolTimetable.slice().sort((a,b)=>a.weekday-b.weekday).map(x=>{
      const s=familyData.examSubjects.find(y=>y.id===x.subjectId);
      return `<div class="small">星期${days[x.weekday]}｜${escapeHtml(s?.name||'已刪除科目')}｜${x.minutes} 分鐘 <button class="btn red" style="padding:2px 7px" onclick="gmDeleteScheduleEntry('${x.id}')">刪除</button></div>`;
    }).join('')||'<div class="small">尚未編排課表。</div>';
    return `<div style="margin:8px 0">${subjectRows}</div>
      <div class="row"><input id="gmNewExamSubject" placeholder="新增科目，例如：自然"><button class="btn blue" onclick="gmAddExamSubject()">＋科目</button></div>
      <div class="grid3" style="margin-top:10px"><div><label>星期</label><select id="gmScheduleWeekday">${[1,2,3,4,5,6,0].map(d=>`<option value="${d}">星期${days[d]}</option>`).join('')}</select></div>
      <div><label>科目</label><select id="gmScheduleSubject">${familyData.examSubjects.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select></div>
      <div><label>分鐘</label><input id="gmScheduleMinutes" type="number" min="1" value="40"></div></div>
      <button class="btn purple" onclick="gmAddScheduleEntry()">＋加入一節課</button><div style="margin-top:10px">${schedule}</div>
      <div class="card small" style="margin-top:10px">${examBossPreviewHTML()}</div>`;
  };
  window.gmAddExamSubject=function(){
    ensureExamBossConfig();const input=document.getElementById('gmNewExamSubject'),name=(input?.value||'').trim();
    if(!name)return alert('請輸入科目名稱');
    if(familyData.examSubjects.some(s=>s.name===name))return alert('這個科目已存在');
    familyData.examSubjects.push({id:'subject_'+uid(),name});relockAllExamBosses('course-added');persistCalendarChange();renderGM();
  };
  window.gmDeleteExamSubject=function(id){
    ensureExamBossConfig();
    if(familyData.schoolTimetable.some(x=>x.subjectId===id))return alert('請先刪除這個科目的課表時段');
    familyData.examSubjects=familyData.examSubjects.filter(s=>s.id!==id);
    familyData.adventureCalendar.forEach(e=>{if(Array.isArray(e.examSubjectIds))e.examSubjectIds=e.examSubjectIds.filter(x=>x!==id);});
    relockAllExamBosses('course-deleted');persistCalendarChange();renderGM();
  };
  window.gmAddScheduleEntry=function(){
    ensureExamBossConfig();const subjectId=document.getElementById('gmScheduleSubject')?.value;
    if(!subjectId)return alert('請先建立科目');
    familyData.schoolTimetable.push({id:uid(),weekday:Number(document.getElementById('gmScheduleWeekday')?.value)||1,subjectId,minutes:Math.max(1,Number(document.getElementById('gmScheduleMinutes')?.value)||40)});
    relockAllExamBosses('timetable-added');persistCalendarChange();renderGM();
  };
  window.gmDeleteScheduleEntry=function(id){familyData.schoolTimetable=familyData.schoolTimetable.filter(x=>x.id!==id);relockAllExamBosses('timetable-deleted');persistCalendarChange();renderGM();};

  function visibleExamEvents(){
    ensureAdventureCalendar();ensureExamBossConfig();
    const semesterStart=gameData.semester?.startDate||OFFICIAL_LAUNCH_DATE;
    return familyData.adventureCalendar.filter(e=>['midterm','final'].includes(e.type)&&e.date>=semesterStart&&calendarVisibleTo(e));
  }
  window.resolveDungeonEventById=function(id){
    return visibleExamEvents().find(e=>e.id===id)||(gameData.events||[]).find(e=>e.id===id)||null;
  };

  const legacyGetTodayEvent=getTodayEvent;
  getTodayEvent=function(){
    const cal=visibleExamEvents().find(e=>e.date===today());
    if(cal)return cal;
    const legacy=legacyGetTodayEvent();
    // 舊期中／期末事件已搬入冒險行事曆，不再允許第二套日期來源召喚 Boss。
    return legacy&&['midterm','final'].includes(legacy.type)?null:legacy;
  };

  function examEventsForType(type){
    return visibleExamEvents().filter(e=>e.type===type).slice().sort((a,b)=>a.date.localeCompare(b.date));
  }
  bossCutoffDate=function(kind='midterm'){
    const list=examEventsForType(kind);
    if(list.length)return list[list.length-1].date;
    return kind==='final'?(gameData.semester?.endDate||'2027-01-14'):'2026-11-06';
  };

  function subjectById(id){ensureExamBossConfig();return familyData.examSubjects.find(s=>s.id===id);}
  function subjectIdForTask(t,allowedIds){
    const id=String(t?.courseId||'');
    return allowedIds.includes(id)?id:'';
  }
  function eventSubjectIds(evt){
    ensureExamBossConfig();
    const ids=(evt?.examSubjectIds||[]).filter(id=>subjectById(id));
    return ids.length?ids:familyData.examSubjects.map(s=>s.id);
  }
  function isExamHoliday(ds){
    return (familyData.adventureCalendar||[]).some(e=>e.date===ds&&e.type==='holiday');
  }
  function studyMinutesUntil(dateStr,subjectIds,startStr=gameData.examBossBaselineV10158?.date||today()){
    const out=Object.fromEntries(subjectIds.map(id=>[id,0]));
    const a=new Date(startStr+'T12:00:00'),b=new Date(dateStr+'T12:00:00');
    if(!Number.isFinite(a.getTime())||!Number.isFinite(b.getTime())||b<=a)return out;
    for(let d=new Date(a);d<b;d.setDate(d.getDate()+1)){
      const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if(isExamHoliday(ds))continue;
      familyData.schoolTimetable.forEach(x=>{if(x.weekday===d.getDay()&&subjectIds.includes(x.subjectId))out[x.subjectId]+=x.minutes;});
    }
    return out;
  }
  function taskPowerGain(t){
    let map={};
    if(t.rewardMode==='auto')map=autoTaskRewards(t.category||'custom',t.difficulty||'normal',t.taskType||'simple');
    else map=t.manualStatRewards||{[t.fixedStat||'will']:Number(t.fixedStatValue)||0};
    return Object.entries(map).reduce((n,[k,v])=>n+(POWER_WEIGHT[k]||0)*(Number(v)||0),0);
  }
  function taskMinutes(t){
    if(t.taskType==='timer')return Math.max(10,Number(t.standardMinutes)||Number(t.fastMinutes)||40);
    return 40;
  }
  function subjectPowerRates(subjectIds){
    const pools=Object.fromEntries(subjectIds.map(id=>[id,[]]));
    const untagged=[];
    (gameData.tasks||[]).filter(t=>t.active!==false&&LEARNING_CATEGORIES.has(t.category)).forEach(t=>{
      const rate=taskPowerGain(t)/(taskMinutes(t)/60);if(rate<=0)return;
      const sid=subjectIdForTask(t,subjectIds);
      if(sid)pools[sid].push(rate);else untagged.push(rate);
    });
    const fallback=Math.max(.5,taskPowerGain({rewardMode:'auto',category:'study',difficulty:'normal',taskType:'timer'})/(40/60));
    const shared=untagged.length?untagged.reduce((a,b)=>a+b,0)/untagged.length:fallback;
    return Object.fromEntries(subjectIds.map(id=>[id,pools[id].length?pools[id].reduce((a,b)=>a+b,0)/pools[id].length:shared]));
  }
  function nextOrCurrentExam(type,evt){
    if(evt?.date)return evt;
    const list=examEventsForType(type);return list.find(e=>e.date>=today())||list[list.length-1]||null;
  }
  function calculateUnlockedExamBossPower(type='midterm',evt=null){
    ensureExamBossConfig();evt=nextOrCurrentExam(type,evt);
    const baseline=gameData.examBossBaselineV10158||{date:today(),nakedPower:combatPower()};
    if(!evt)return Math.max(SEMESTER_BALANCE.minPower,Math.round(baseline.nakedPower*(type==='final'?1.20:1.10)));
    const ids=eventSubjectIds(evt),minutes=studyMinutesUntil(evt.date,ids),rates=subjectPowerRates(ids);
    const expectedGrowth=ids.reduce((n,id)=>n+(minutes[id]/60)*(rates[id]||0)*SEMESTER_BALANCE.targetCompletion,0);
    // 固定以啟用新系統當天的裸裝四維戰力為起點；不讀目前角色，也不讀裝備。
    const expectedHero=Math.max(1,Number(baseline.nakedPower)||1)+expectedGrowth;
    const multiplier=type==='final'?1.20:1.10;
    return Math.max(SEMESTER_BALANCE.minPower,Math.round(expectedHero*multiplier));
  }
  window.lockExamBossForEvent=function(evt,force=false){
    if(!evt||!['midterm','final'].includes(evt.type))return 0;
    ensureExamBossConfig();evt.bossPowerByProfile=evt.bossPowerByProfile||{};
    const old=evt.bossPowerByProfile[activeProfileId];
    if(old&&!force)return Number(old.power)||0;
    const power=calculateUnlockedExamBossPower(evt.type,evt);
    const ids=eventSubjectIds(evt),minutes=studyMinutesUntil(evt.date,ids);
    evt.bossPowerByProfile[activeProfileId]={power,lockedAt:new Date().toISOString(),baselineDate:gameData.examBossBaselineV10158.date,baselineNakedPower:gameData.examBossBaselineV10158.nakedPower,subjectMinutes:{...minutes},equipmentExcluded:true};
    try{persistFamily();}catch(e){}
    return power;
  };
  window.relockAllExamBosses=function(reason='config-changed'){
    visibleExamEvents().forEach(evt=>{lockExamBossForEvent(evt,true);const lock=evt.bossPowerByProfile?.[activeProfileId];if(lock)lock.reason=reason;});
  };
  window.calculateExamBossPower=function(type='midterm',evt=null){
    ensureExamBossConfig();evt=nextOrCurrentExam(type,evt);
    if(!evt)return calculateUnlockedExamBossPower(type,null);
    return lockExamBossForEvent(evt,false)||calculateUnlockedExamBossPower(type,evt);
  };
  eventSuggestedPower=function(type='midterm',evt=null){return calculateExamBossPower(type==='final'?'final':'midterm',evt);};
  const oldResolvedDungeonPower=resolvedDungeonPower;
  resolvedDungeonPower=function(evt,monster){
    if(evt?.type==='midterm'||evt?.type==='final')return eventSuggestedPower(evt.type,evt);
    return oldResolvedDungeonPower(evt,monster);
  };

  function taskCourseShares(t,subjectIds){
    const out={};const direct=subjectIdForTask(t,subjectIds);
    if(direct){out[direct]=1;return out;}
    if(!LEARNING_CATEGORIES.has(t?.category)||t?.courseId)return out;
    subjectIds.forEach(id=>out[id]=1/Math.max(1,subjectIds.length));
    return out;
  }
  function dateText(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function taskRequiredOnHistoricalDate(t,ds){
    if(!t)return false;
    if(t.archived){
      const until=t.activeUntil||String(t.archivedAt||'').slice(0,10)||today();
      if(ds>until)return false;
    }else if(t.active===false)return false;
    const from=t.activeFrom||t.createdDate||gameData.semester?.startDate||ds;
    const until=t.activeUntil||'9999-12-31';
    return ds>=from&&ds<=until;
  }
  function taskScheduledOnHistoricalDate(t,ds){
    if(!t||Array.isArray(t.cancelledDates)&&t.cancelledDates.includes(ds))return false;
    if(t.recurring!==true)return ds===(t.date||t.createdDate||t.activeFrom||ds);
    const wd=weekdayNumberFor(ds),days=Array.isArray(t.weekdays)&&t.weekdays.length?t.weekdays:[1,2,3,4,5,6,0];
    return days.includes(wd);
  }
  function examCompletionTargetSnapshot(evt){
    ensureExamBossConfig();
    const ids=eventSubjectIds(evt);
    const semesterStart=gameData.semester?.startDate||OFFICIAL_LAUNCH_DATE;
    gameData.examCompletionTargetsV101716=gameData.examCompletionTargetsV101716||{};
    const key=String(evt.id||`${evt.type||'exam'}_${evt.date}`);
    let snap=gameData.examCompletionTargetsV101716[key];
    const sameSubjects=snap&&Array.isArray(snap.subjectIds)&&snap.subjectIds.length===ids.length&&ids.every(id=>snap.subjectIds.includes(id));
    if(!snap||snap.semesterStart!==semesterStart||snap.examDate!==evt.date||!sameSubjects){
      // 完成率量表只在建立時換算一次：學期課表總時數 × 當下每科戰力/小時基準 × 75%。
      // 之後每日任務增減不再改動分母；Boss 預估仍維持原本動態 subjectPowerRates()。
      const minutes=studyMinutesUntil(evt.date,ids,semesterStart);
      const rates=subjectPowerRates(ids);
      const required=Object.fromEntries(ids.map(id=>[id,Math.max(0,(Number(minutes[id])||0)/60*(Number(rates[id])||0)*SEMESTER_BALANCE.targetCompletion)]));
      snap={semesterStart,examDate:evt.date,subjectIds:[...ids],minutes:{...minutes},rates:{...rates},required,createdAt:new Date().toISOString()};
      gameData.examCompletionTargetsV101716[key]=snap;
      try{saveGame();}catch(e){}
    }
    return snap;
  }

  window.examTaskCompletionReport=function(evt){
    ensureExamBossConfig();if(!evt)return {ratio:0,approved:0,required:0,byCourse:{}};
    const ids=eventSubjectIds(evt),base=gameData.semester?.startDate||OFFICIAL_LAUNCH_DATE;
    const approvedEnd=today()<evt.date?today():evt.date;
    const snap=examCompletionTargetSnapshot(evt);
    const byCourse=Object.fromEntries(ids.map(id=>[id,{approved:0,required:Math.max(0,Number(snap?.required?.[id])||0)}]));
    (gameData.taskRecords||[]).forEach(r=>{
      if(r.date<base||r.date>approvedEnd||r.approvalStatus==='pending'||r.approvalStatus==='rejected')return;
      const ratio=taskApprovalRatio(r);if(ratio<=0)return;
      if(r.voluntaryChallenge===true)return;
      const t=(gameData.tasks||[]).find(x=>x.id===r.taskId)||r.taskSnapshot;if(!t)return;
      const shares=taskCourseShares(t,ids),points=taskPowerGain(t)*ratio;
      Object.entries(shares).forEach(([id,share])=>byCourse[id].approved+=points*share);
    });
    const required=Object.values(byCourse).reduce((n,x)=>n+x.required,0);
    const approved=Object.values(byCourse).reduce((n,x)=>n+x.approved,0);
    return {required,approved,ratio:required?Math.min(1.2,approved/required):0,byCourse};
  };

  // Read-only exam energy audit. Lives in the same scope as the production formula
  // so every row uses the exact production helpers above.
  window.studyRPGAuditExamEnergy=function(evt=null){
    ensureExamBossConfig();
    evt=nextOrCurrentExam('midterm',evt);
    if(!evt)return {error:'找不到期中考事件',rows:[],byCourse:{}};
    const ids=eventSubjectIds(evt),base=gameData.semester?.startDate||OFFICIAL_LAUNCH_DATE;
    const approvedEnd=today()<evt.date?today():evt.date;
    const snap=examCompletionTargetSnapshot(evt),rows=[],groups=new Map();
    (gameData.taskRecords||[]).forEach((r,index)=>{
      if(r.date<base||r.date>approvedEnd)return;
      const t=(gameData.tasks||[]).find(x=>x.id===r.taskId)||r.taskSnapshot;if(!t)return;
      const ratio=taskApprovalRatio(r),shares=taskCourseShares(t,ids),rawPoints=taskPowerGain(t);
      const eligible=!(r.approvalStatus==='pending'||r.approvalStatus==='rejected'||ratio<=0||r.voluntaryChallenge===true);
      Object.entries(shares).forEach(([id,share])=>rows.push({
        index,recordId:r.id||'',date:r.date||'',taskId:r.taskId||'',taskName:t.name||t.title||t.id||'未命名任務',
        subjectId:id,subjectName:subjectById(id)?.name||id,approvalStatus:r.approvalStatus??'(缺少)',
        approvalRatio:ratio,rawPoints,share,contribution:eligible?rawPoints*ratio*share:0,
        voluntaryChallenge:r.voluntaryChallenge===true,
        duplicateKey:`${r.date||''}::${r.taskStableId||r.taskId||''}`
      }));
      const k=`${r.date||''}::${r.taskStableId||r.taskId||''}`;
      if(k!=='::'){const a=groups.get(k)||[];a.push(r);groups.set(k,a)}
    });
    const duplicateKeys=new Set([...groups].filter(([,a])=>a.length>1).map(([k])=>k));
    rows.forEach(x=>x.duplicate=duplicateKeys.has(x.duplicateKey));
    const byCourse=Object.fromEntries(ids.map(id=>[id,{
      name:subjectById(id)?.name||id,
      approved:rows.filter(x=>x.subjectId===id).reduce((n,x)=>n+x.contribution,0),
      required:Math.max(0,Number(snap?.required?.[id])||0)
    }]));
    return {eventId:evt.id,eventDate:evt.date,base,approvedEnd,rows,byCourse,duplicateCount:duplicateKeys.size};
  };

  function examEnergyStage(r){
    const ratio=(Number(r?.required)||0)>0?(Number(r?.approved)||0)/Number(r.required):0;
    if(ratio>=1)return 1;
    if(ratio>=.8)return .8;
    if(ratio>=.5)return .5;
    return 0;
  }
  function examSubjectBreakRole(subject,index=0){
    const id=String(subject?.id||'').toLowerCase(),name=String(subject?.name||'');
    if(id==='chinese'||/國語|中文|華語/.test(name))return 'hp';
    if(id==='english'||/英語|英文|國際文化/.test(name))return 'magic';
    if(id==='math'||/數學|數理/.test(name))return 'physical';
    return ['hp','magic','physical'][index%3];
  }
  function examEnergyStageText(stage){
    return stage>=1?'✨ 完全破盾':stage>=.8?'💥 重度破盾（80%效果）':stage>=.5?'⚡ 護盾裂痕（50%效果）':'護盾尚未削弱';
  }
  function applyExamEnergyBreakToBattle(eventType){
    if(!battleStateV10||!['midterm','final'].includes(eventType)||battleStateV10.testMode)return;
    const events=examEventsForType(eventType),evt=events[events.length-1];if(!evt)return;
    const report=examTaskCompletionReport(evt),ids=eventSubjectIds(evt),enemy=battleStateV10.enemy;
    const results=[];
    ids.forEach((id,index)=>{
      const subject=subjectById(id)||{id,name:id},r=report.byCourse[id]||{approved:0,required:0},stage=examEnergyStage(r);
      if(stage<=0){results.push({name:subject.name,stage,required:Number(r.required)||0,role:examSubjectBreakRole(subject,index)});return;}
      const weaken=.12*stage,role=examSubjectBreakRole(subject,index);
      if(role==='hp'){
        enemy.maxHp=Math.max(1,Math.round(enemy.maxHp*(1-weaken)));enemy.hp=Math.min(enemy.hp,enemy.maxHp);battleStateV10.enemyHp=enemy.hp;
      }else if(role==='magic'){
        enemy.magicAttack*=1-weaken;enemy.magicDefense*=1-weaken;
      }else{
        enemy.attack*=1-weaken;enemy.defense*=1-weaken;
      }
      results.push({name:subject.name,stage,required:Number(r.required)||0,role,weaken});
    });
    battleStateV10.examEnergyBreak={eventId:evt.id,results};
    renderBattleTargets();updateBattleHp('enemy',enemy.hp,enemy.maxHp);
    const roleText={hp:'最大HP',magic:'魔攻／魔防',physical:'物攻／物防'};
    results.forEach(x=>addBattleLog(`📚 ${x.name}：${examEnergyStageText(x.stage)}${x.stage>0?`｜Boss ${roleText[x.role]} −${Math.round(x.weaken*100)}%`:''}`));
    const eligible=results.filter(x=>x.required>0);
    if(eligible.length&&eligible.every(x=>x.stage>=1)){
      const amount=Math.max(1,Math.round(battleStateV10.hero.maxHp*.15));
      battleStateV10.examEnergyShield={hp:amount,maxHp:amount};
      battleStateV10.hero.statuses.push({type:'exam_energy_shield',name:`📚 完全備戰護盾 ${amount}`,turns:999,effectType:'buff',mods:{},unstealable:true});
      updateBattleStatuses();addBattleLog(`🌟 全部考科完全破盾：勇者獲得 ${amount} 點考前護盾！`);
    }
  }
  window.applyExamEnergyBreakToBattle=applyExamEnergyBreakToBattle;

  const oldRunBattleSequenceExamEnergy=runBattleSequence;
  runBattleSequence=function(...args){
    const result=oldRunBattleSequenceExamEnergy(...args);
    applyExamEnergyBreakToBattle(args[5]);
    return result;
  };
  const oldExecuteEnemyHitExamEnergy=executeEnemyHit;
  executeEnemyHit=async function(unit,skill){
    const shield=battleStateV10?.examEnergyShield,before=Number(battleStateV10?.heroHp)||0;
    await oldExecuteEnemyHitExamEnergy(unit,skill);
    if(!shield||shield.hp<=0||!battleStateV10)return;
    const lost=Math.max(0,before-(Number(battleStateV10.heroHp)||0)),absorbed=Math.min(lost,shield.hp);
    if(absorbed<=0)return;
    shield.hp-=absorbed;battleStateV10.heroHp=Math.min(battleStateV10.hero.maxHp,battleStateV10.heroHp+absorbed);
    const status=battleStateV10.hero.statuses.find(s=>s.type==='exam_energy_shield');
    if(shield.hp<=0){battleStateV10.hero.statuses=battleStateV10.hero.statuses.filter(s=>s.type!=='exam_energy_shield');addBattleLog('💫 考前護盾已耗盡。');}
    else if(status)status.name=`📚 完全備戰護盾 ${Math.round(shield.hp)}`;
    updateBattleHp('hero',battleStateV10.heroHp,battleStateV10.hero.maxHp);updateBattleStatuses();
    addBattleLog(`🛡️ 考前護盾吸收 ${Math.round(absorbed)} 傷害。`);
  };

  window.renderExamLearningEnergyHTML=function(){
    ensureExamBossConfig();
    const icons={'國語':'📖','英語':'🔤','英文':'🔤','數學':'🔢'};
    const section=type=>{
      const list=examEventsForType(type),evt=list[list.length-1]||null;if(!evt)return '';
      const report=examTaskCompletionReport(evt),ids=eventSubjectIds(evt);
      const rows=ids.map(id=>{
        const name=subjectById(id)?.name||id,r=report.byCourse[id]||{approved:0,required:0};
        const pct=r.required?Math.max(0,Math.min(100,Math.round(r.approved/r.required*100))):0,cls=pct>=100?'full':pct>=70?'high':pct>=35?'mid':'';
        const missing=Math.max(0,r.required-r.approved);
        return `<div class="exam-energy-row"><div class="exam-energy-label"><span>${icons[name]||'📚'} ${escapeHtml(name)}能量</span><span>${r.approved.toFixed(1)} / ${r.required.toFixed(1)}</span></div>
          <div class="exam-energy-track"><div class="exam-energy-fill ${cls}" style="width:${pct}%"></div></div>
          <div class="exam-energy-note">${r.required?`${examEnergyStageText(examEnergyStage(r))}｜完成 ${pct}%${pct<100?`｜還差 ${missing.toFixed(1)} 格`:''}`:'尚未設定這科的總需求'}</div></div>`;
      }).join('');
      return `<div class="exam-energy-head"><strong>⚡ ${type==='final'?'期末':'期中'}總需求</strong><span class="pill">截止 ${evt.date}</span></div>${rows}`;
    };
    const html=[section('midterm'),section('final')].filter(Boolean).join('<hr>');
    return html?`<div class="card exam-energy-card"><h3>🔋 考前總能量</h3>${html}<div class="small">總需求固定計算到考試最後一天；只有家長核定後才充能，裝備不計入。50%／80%／100%會逐段削弱考試 Boss；所有考科滿格再獲得15%最大生命護盾。</div></div>`:'';
  };

  window.examBossPreviewHTML=function(){
    ensureExamBossConfig();
    const render=type=>{
      const evt=nextOrCurrentExam(type,null);if(!evt)return `${type==='midterm'?'期中':'期末'}：尚未在冒險日曆設定`;
      const ids=eventSubjectIds(evt),mins=studyMinutesUntil(evt.date,ids),report=examTaskCompletionReport(evt);
      const detail=ids.map(id=>`${escapeHtml(subjectById(id)?.name||id)} ${(mins[id]/60).toFixed(1)} 小時`).join('｜');
      const progress=ids.map(id=>{const r=report.byCourse[id]||{approved:0,required:0};return `${escapeHtml(subjectById(id)?.name||id)} ${r.required?Math.round(r.approved/r.required*100):0}%`;}).join('｜');
      const lock=evt.bossPowerByProfile?.[activeProfileId];
      return `<b>${type==='midterm'?'期中':'期末'} ${evt.date}</b>｜${detail}<br>固定 Boss 戰力：⚔️ ${calculateExamBossPower(type,evt)} ${lock?'🔒':''}<br>考前總需求達成率：${progress}｜總計 ${Math.round(report.ratio*100)}%（已核定 ${report.approved.toFixed(1)}／總需求 ${report.required.toFixed(1)}）<br><span class="small">分母固定計算到考試最後一天；分子只計入截至今天已由家長核定的任務。基準裸裝戰力 ${gameData.examBossBaselineV10158?.nakedPower||combatPower()}；裝備數值不參與 Boss 推算。</span>`;
    };
    return `${render('midterm')}<hr>${render('final')}<div class="small">任務以課表科目 ID 直接連結；未指定科目的功課／考卷／課內閱讀平均分配。待核定任務為 0%，核定 100%／80%／50% 後才計入。Boss 戰力鎖定後不會隨角色、裝備或日期浮動；只有修改考試、課表或任務設定時重算。</div>`;
  };
  // 原程式的 boot() 位於本模組之前；載入完成後補做一次安全重繪。
  // 只有「今天是新行事曆考試且尚未挑戰」時才重建副本，普通日不碰既有 dailyDungeon。
  if(gameData.hero?.name){
    const todayExam=visibleExamEvents().find(e=>e.date===today());
    if(todayExam&&!gameData.dailyDungeon?.challenged&&gameData.dailyDungeon?.eventId!==todayExam.id){
      gameData.dailyDungeon={date:'',monsterId:'',challenged:false,lastChallengeDate:gameData.dailyDungeon?.lastChallengeDate||'',result:'',drop:null,eventId:''};
      ensureDailyDungeon();
    }
    renderAll();
  }
})();

<script>
/* V10.11.59：行事曆驅動學期／寒暑假、無盡之塔、週目技能與詞條。 */
(function(){
  const CAMPAIGN_TYPES=new Set(['winter_break_start','summer_break_start','semester_start']);
  function ensureCampaignState(){
    familyData.campaign=familyData.campaign||{mode:'semester',cycle:1,activeEventId:'',previousSeasonId:'',activeSemesterStart:gameData.semester?.startDate||OFFICIAL_LAUNCH_DATE};
    if(!Number.isFinite(Number(familyData.campaign.cycle)))familyData.campaign.cycle=1;

  function latestCampaignEvent(){

  function semesterStorageId(date,cycle){return `SEM_${String(date||today()).replaceAll('-','_')}_C${Math.max(1,Number(cycle)||1)}`;}
  window.applyCampaignCalendarState=function(){

        const nextCycle=evt.semesterMode==='standard'?1:(laterThanOld?Math.max(1,Number(familyData.campaign.cycle)||1)+1:Math.max(1,Number(familyData.campaign.cycle)||1));

        familyData.campaign.cycle=nextCycle;familyData.campaign.mode='semester';familyData.campaign.activeEventId=evt.id;familyData.campaign.activeSemesterEventId=evt.id;familyData.campaign.activeSemesterStart=evt.date;
        familyData.seasonId=semesterStorageId(evt.date,nextCycle);changed=true;
      }
      if(gameData.campaignProgress.lastAppliedSemesterEventId!==evt.id){
        gameData.semesterArchives.push({seasonId:familyData.campaign.previousSeasonId||gameData.season?.id||currentSeasonStorageId(),startDate:gameData.semester?.startDate||'',endedAt:evt.date,cycle:gameData.campaignProgress.cycle||1,level:gameData.hero.level,stats:{...gameData.hero.stats},battleCount:(gameData.battleRecords||[]).length});
        gameData.campaignProgress={cycle:familyData.campaign.cycle,mode:'semester',lastAppliedSemesterEventId:evt.id,semesterStartDate:evt.date};
        gameData.semester.startDate=evt.date;gameData.semester.worldState='normal';
        gameData.dailyDungeon={date:'',monsterId:'',challenged:false,lastChallengeDate:gameData.dailyDungeon?.lastChallengeDate||'',result:'',drop:null,eventId:''};
        gameData.examBossBaselineV10158={date:evt.date,nakedPower:Math.max(1,combatPower()),createdAt:new Date().toISOString(),equipmentExcluded:true};
        gameData.season={id:familyData.seasonId,launchDate:evt.date,official:true,cycle:familyData.campaign.cycle};
        changed=true;
      }
    }
    if(changed){persistFamily();if(window.cloudSaveGame)window.cloudSaveGame();}
    return familyData.campaign.mode;
  };
  window.currentCampaignMode=function(){return applyCampaignCalendarState();};
  window.currentCampaignCycle=function(){ensureCampaignState();return Math.max(1,Number(gameData.campaignProgress?.cycle||familyData.campaign.cycle)||1);};
  window.toggleCampaignEventFields=function(){const box=document.getElementById('gmCampaignEventFields'),type=document.getElementById('gmCalType')?.value;if(box)box.style.display=type==='semester_start'?'block':'none';};

  function towerMonsterForFloor(floor){
    const pool=WEEKLY_MAP_DATABASE.flatMap(w=>(w.monsters||[])).filter(id=>id&&MONSTER_DATABASE[id]);
    const bosses=pool.filter(id=>MONSTER_DATABASE[id]?.boss),normal=pool.filter(id=>!MONSTER_DATABASE[id]?.boss);
    const source=floor%5===0?(bosses.length?bosses:pool):(normal.length?normal:pool);
    let seed=floor*37+currentCampaignCycle()*101;return source[Math.abs(seed)%source.length]||'slime_water';
  }
  function towerPower(floor){return Math.max(18,Math.round(combatPower()*(.78+floor*.055+(currentCampaignCycle()-1)*.08)));}
  function towerAffixItem(floor){
    if(typeof window.generateRandomEquipmentDrop==='function')return window.generateRandomEquipmentDrop({source:'tower',tier:Math.max(0,currentCampaignCycle()-1),floor,forceAffix:true});
    const rarity=floor>=30?'傳說':floor>=20?'史詩':floor>=10?'稀有':'優良';
    const affixPool=[{name:'猛攻',stat:'attack',value:2+Math.floor(floor/5)},{name:'秘法',stat:'magicAttack',value:2+Math.floor(floor/5)},{name:'鐵壁',stat:'defense',value:2+Math.floor(floor/6)},{name:'迅捷',stat:'speed',value:1+Math.floor(floor/8)},{name:'生命',stat:'maxHp',value:10+floor*2}];
    const count=floor>=20?3:floor>=10?2:1,chosen=[];for(let i=0;i<count;i++)chosen.push(affixPool[(floor+i*2)%affixPool.length]);
    const id='tower_item_'+uid(),stats={};chosen.forEach(a=>stats[a.stat]=(stats[a.stat]||0)+a.value);
    const item={id,name:`${rarity}・古塔遺物 ${floor}F`,icon:'🟣',category:'equipment',equipSlot:['weapon','head','body','accessory'][floor%4],description:`無盡之塔 ${floor}F 掉落｜${chosen.map(a=>a.name+' +'+a.value).join('、')}`,price:0,dailyLimit:1,active:false,stats,affixes:chosen};
    gameData.shopItems.push(item);gameData.inventory.push({id:uid(),itemId:id,name:item.name,status:'unused',boughtDate:today(),source:'tower',affixes:chosen});return {type:'equipment',label:`${item.icon} ${item.name}｜${chosen.map(a=>a.name+' +'+a.value).join('、')}`,value:id};
  }
  window.renderHolidayTower=function(){
    if(typeof window.isEquipmentEndgameUnlocked==='function'&&!window.isEquipmentEndgameUnlocked()){const el=document.getElementById('panel-dungeon');if(el)el.innerHTML='<div class="card boss" style="text-align:center"><div style="font-size:42px">🔒🗼</div><h2>無盡之塔尚未解鎖</h2><div class="small">必須先擊破第20週的骷髏巨龍，斬斷靈魂連結並完成第一學期主線。</div></div>';return;}
    ensureHolidayTower();const el=document.getElementById('panel-dungeon'),floor=Math.max(1,(gameData.holidayTower.bestFloor||0)+1),id=towerMonsterForFloor(floor),m=MONSTER_DATABASE[id];
    el.innerHTML=`<div class="card boss" style="text-align:center"><div style="font-size:42px">🗼</div><h2>無盡之塔・第 ${floor} 層</h2><div class="small">${familyData.campaign?.mode==='holidayTower'?'寒暑假模式':'塔模式'}｜今日剩餘 ${towerRunsLeft()} 次｜最高 ${gameData.holidayTower.bestFloor||0} 層｜第 ${currentCampaignCycle()} 週目</div><div class="card"><strong>${m?.boss?'👑 ':''}${m?.name||'古塔魔物'}</strong><div>預估戰力 ⚔️ ${towerPower(floor)}</div><div class="small">每5層 Boss；層數越高，裝備詞條越多。</div></div><button class="btn purple big-battle-btn" ${towerRunsLeft()<=0?'disabled':''} onclick="challengeHolidayTower()">${towerRunsLeft()<=0?'今日次數已用完':'挑戰第 '+floor+' 層'}</button></div>`;
  };
  window.challengeHolidayTower=function(){
    if(typeof window.isEquipmentEndgameUnlocked==='function'&&!window.isEquipmentEndgameUnlocked())return alert('必須先完成第一學期最終戰，才能進入無盡之塔。');
    ensureHolidayTower();if(towerRunsLeft()<=0)return alert('今天的無盡之塔次數已用完');
    const floor=Math.max(1,(gameData.holidayTower.bestFloor||0)+1),id=towerMonsterForFloor(floor),m=MONSTER_DATABASE[id];gameData.holidayTower.runsUsed++;
    runBattleSequence(`${m?.name||'古塔魔物'}・${floor}F`,m?.boss?'👑':'👹',towerPower(floor),Math.max(2,Math.floor(floor/3)),Math.max(10,floor*3),'tower',id);
    battleStateV10.towerMode=true;battleStateV10.towerFloor=floor;saveGame();
  };
  const oldFinishBattleV10159=finishBattleV10;
  finishBattleV10=async function(win){
    const s=battleStateV10;if(!s?.towerMode)return oldFinishBattleV10159(win);
    const floor=s.towerFloor||1,rating=calculateBattleRating(win,s.heroHp,s.hero.maxHp,s.round);let drop=null;
    if(win){gameData.holidayTower.bestFloor=Math.max(gameData.holidayTower.bestFloor||0,floor);gameData.hero.gold+=s.baseGold;addExp(s.baseExp);drop=towerAffixItem(floor);}
    gameData.battleRecords.push({id:uid(),date:today(),enemyName:s.enemyName,power:combatPower(),enemyPower:s.enemyPower,result:win?'win':'lose',eventType:'tower',towerFloor:floor,drop,rounds:s.round,rating});saveGame();showBattleWord(win?'🏆 登塔成功！':'💀 挑戰失敗');
    document.getElementById('battleActions').style.display='none';document.getElementById('battleSubmenu').style.display='none';document.getElementById('battleResult').innerHTML=`<div class="battle-result"><div class="battle-result-icon">${win?'🗼':'💀'}</div><h2>${win?'第 '+floor+' 層突破！':'挑戰失敗'}</h2>${win?`<div>⭐ EXP +${s.baseExp}　💰 +${s.baseGold} G</div><div>🎁 ${drop?.label||'沒有掉落'}</div>`:'<div class="small">戰敗不扣能力、裝備或金幣。</div>'}<button class="btn ${win?'gold':'gray'} battle-close" onclick="closeBattleOverlay()">返回無盡之塔</button></div>`;
  };

  const oldRenderDungeonV10159=renderDungeon;
  renderDungeon=function(){if(currentCampaignMode()==='holidayTower')return renderHolidayTower();return oldRenderDungeonV10159();};

  const NG_SKILLS=['goblin_heavy_slash','spider_poison_fang','goblin_guard','shadow_arrow','chain_lightning'];
  const NG_AFFIXES=[{id:'ferocious',name:'狂暴',apply:u=>{u.attack*=1.10;u.magicAttack*=1.10;}},{id:'armored',name:'裝甲',apply:u=>{u.defense*=1.12;u.magicDefense*=1.12;}},{id:'swift',name:'迅捷',apply:u=>{u.speed*=1.10;}},{id:'regeneration',name:'再生',apply:u=>{u.ngRegeneration=true;}}];
  const oldMakeLiveEnemyV10159=makeLiveEnemy;
  makeLiveEnemy=function(monsterId,power,eventType='daily',opts={}){const u=oldMakeLiveEnemyV10159(monsterId,power,eventType,opts),cycle=currentCampaignCycle();if(cycle>1&&!opts.isSummon){const count=Math.min(3,cycle-1);u.ngPlusSkillId=NG_SKILLS[Math.abs(String(monsterId).split('').reduce((n,c)=>n+c.charCodeAt(0),cycle))%NG_SKILLS.length];u.ngAffixes=[];for(let i=0;i<count;i++){const a=NG_AFFIXES[(i+cycle+String(monsterId).length)%NG_AFFIXES.length];if(!u.ngAffixes.some(x=>x.id===a.id)){a.apply(u);u.ngAffixes.push({id:a.id,name:a.name});}}u.name+=`【${u.ngAffixes.map(a=>a.name).join('・')}】`;}return u;};
  const oldChooseLiveEnemySkillV10159=chooseLiveEnemySkill;

  const oldPerformLiveEnemyTurnV10159=performLiveEnemyTurn;
  performLiveEnemyTurn=async function(unit){if(unit?.ngRegeneration&&unit.hp>0&&unit.hp<unit.maxHp){const heal=Math.max(1,Math.round(unit.maxHp*.02));unit.hp=Math.min(unit.maxHp,unit.hp+heal);addBattleLog(`♻️ ${unit.name}的再生詞條恢復 ${heal} HP。`);}return oldPerformLiveEnemyTurnV10159(unit);};

  applyCampaignCalendarState();
  if(gameData.hero?.name)renderAll();

/* V10.11.64：任務封存、任務快照與可回收的自主挑戰加碼。 */
(function(){

/* V10.11.78：法師魔力增幅常駐與魔力護盾實際承傷。 */
/* =========================================================
   StudyRPG Canonical Combat Runtime Pipeline
   Consolidates legacy V10.11.78~V10.11.91 wrapper chains.
   Feature behavior is preserved; core functions are composed once after registration.
   ========================================================= */
window.StudyRPGCombatRuntimeCanonical=window.StudyRPGCombatRuntimeCanonical||(()=>{
  const chains=new Map();
  return {
    register(name,middleware){
      if(typeof middleware!=='function')throw new TypeError('runtime middleware must be a function');
      if(!chains.has(name))chains.set(name,[]);
      chains.get(name).push(middleware);
    },
    finalize(){
      for(const [name,list] of chains){
        let current=window[name];
        if(typeof current!=='function'){
          console.warn(`[StudyRPG] canonical runtime skipped missing function: ${name}`);
          continue;
        }
        for(const middleware of list){
          const next=current;
          current=function(...args){return middleware.call(this,next.bind(this),...args);};
        }
        window[name]=current;
      }
      chains.clear();
    }
  };
})();
(function(){
  window.StudyRPGCombatRuntimeCanonical.register('executeEnemyHit',async function(next,unit,skill){
    const f=battleStateV10?.formal,hero=battleStateV10?.hero;
    const shield=f?.cls==='法師'?(hero?.statuses||[]).find(s=>Number(s.mods?.manaShield||0)>0):null;
    const hpBefore=Number(battleStateV10?.heroHp)||0;
    await next(unit,skill);
    if(!shield||!battleStateV10||battleStateV10.ended)return;
    const lost=Math.max(0,hpBefore-(Number(battleStateV10.heroHp)||0));
    const ratio=Math.max(0,Math.min(1,Number(shield.mods.manaShield)||0));
    const payable=Math.max(0,Math.floor(Number(f.mp)||0));
    const absorbed=Math.min(Math.round(lost*ratio),payable);
    if(absorbed<=0)return;
    f.mp=Math.max(0,f.mp-absorbed);
    battleStateV10.heroHp=Math.min(hero.maxHp,battleStateV10.heroHp+absorbed);
    updateBattleHp('hero',battleStateV10.heroHp,hero.maxHp);
    updateFormalResourceUI();
    addBattleLog(`🔷 魔力護盾消耗 ${absorbed} MP，抵消 ${absorbed} 傷害。`);
  });
})();
</script>

      '戰士':{attack:3,maxHp:2.4,defense:2.2,block:2,magicDefense:1,speed:.7},
      '法師':{magicAttack:3,maxEnergy:2.5,crit:1.5,speed:1,magicDefense:1.2},

  function smartScore(item){

  }
  function dropSource(){const s=window.battleStateV10||{},id=s.monsterId;if(s.towerMode||s.eventType==='tower')return'tower';if(s.celebrationReplay||s.eventType==='replay')return'replay';if(s.eventType==='final')return'final';if(s.eventType==='midterm')return'midterm';if(String(id||'').startsWith('apocalypse_'))return'apocalypse';if(id==='demon_general')return'demon_general';return new Date(today()+'T12:00:00').getDay()===5?'friday':'weekday';}

  window.rollEquipmentPoolDrop=window.rollEquipmentDatabaseDrop;

  const originalDungeonDrop=window.rollDungeonDrop;
  window.rollDungeonDrop=function(rating=1){const source=dropSource(),drop=rollEquipmentDatabaseDrop(source);if(drop)return drop;const active=[];for(const item of gameData.shopItems){if(item.category==='equipment'&&item.active){active.push(item);item.active=false;}}try{return originalDungeonDrop(rating);}finally{active.forEach(x=>x.active=true);}};
  const originalRandomDrop=window.generateRandomEquipmentDrop;
  window.generateRandomEquipmentDrop=function(opts={}){const source=opts.source==='tower'?'tower':opts.source==='boss_replay'?'replay':opts.source||dropSource(),drop=rollEquipmentDatabaseDrop(source,opts.rarity||null);if(drop)return drop;return originalRandomDrop(opts);};

  function enhancementBase(item){if(item.baseStatsForEnhancement)return item.baseStatsForEnhancement;const raw={...(item.stats||{})};item.baseStatsForEnhancement={...raw};item.unenhancedStats={...raw};return item.baseStatsForEnhancement;}
  const ENHANCE_COST=[0,2,3,4,5,6,8,10,12,15,20],ENHANCE_KEYS=new Set(['attack','magicAttack','defense','magicDefense','maxHp','maxEnergy','speed']);
  window.toggleEquipmentLock=function(id){const inv=gameData.inventory.find(x=>x.id===id);if(!inv)return;inv.locked=!inv.locked;saveGame();renderBag();};
  window.sellEquipment=function(id){const inv=gameData.inventory.find(x=>x.id===id),item=inv&&itemDef(inv);if(!inv||!item||equippedInventory(inv)||inv.locked)return alert('已裝備或已鎖定的裝備不能出售。');const rarity=rarityOf(item),score=Math.max(1,Number(equipmentPowerScore?.(item))||1),mult={common:.6,uncommon:1,rare:1.8,epic:3.5,legendary:8}[rarity]||1,value=Math.max(1,Math.round(score*mult));if(!confirm(`出售【${inv.name}】並獲得 ${value} G？`))return;if(rarity==='legendary'&&!confirm('這是橘色獨特裝備，確定仍要出售？'))return;gameData.hero.gold+=value;gameData.inventory=gameData.inventory.filter(x=>x.id!==id);saveGame();renderAll();};
  window.dismantleEquipment=function(id){const inv=gameData.inventory.find(x=>x.id===id),item=inv&&itemDef(inv);if(!inv||!item||equippedInventory(inv)||inv.locked)return alert('已裝備或已鎖定的裝備不能分解。');const rarity=rarityOf(item);if(rarity==='legendary')return alert('橘色裝備無法分解。');const amount={common:1,uncommon:3,rare:8,epic:20}[rarity]||1;if(['rare','epic'].includes(rarity)&&!confirm(`分解【${inv.name}】取得 ${amount} 強化碎片？`))return;gameData.hero.enhancementShards+=amount;gameData.inventory=gameData.inventory.filter(x=>x.id!==id);saveGame();renderAll();};
  window.enhanceEquipment=function(id){const inv=gameData.inventory.find(x=>x.id===id);let item=inv&&itemDef(inv);if(!inv||!item)return;if(!inv.itemData){inv.itemData=JSON.parse(JSON.stringify(item));item=inv.itemData;}const lv=Math.max(0,Number(item.enhancementLevel)||0);if(lv>=10)return alert('這件裝備已經強化到＋10。');const cost=ENHANCE_COST[lv+1];if(gameData.hero.enhancementShards<cost)return alert(`強化碎片不足，需要 ${cost}。`);if(!confirm(`消耗 ${cost} 碎片，將【${inv.name}】強化至＋${lv+1}？`))return;gameData.hero.enhancementShards-=cost;const original={...(item.unenhancedStats||item.stats||{})},base=enhancementBase(item),next=lv+1;item.unenhancedStats=original;item.stats={...original};for(const [k,v] of Object.entries(base))if(ENHANCE_KEYS.has(k))item.stats[k]=Math.round((Number(original[k])+(Number(v)||0)*.03*next)*100)/100;item.enhancementLevel=next;saveGame();renderAll();};
  window.bulkProcessLowEquipment=function(mode){const targets=gameData.inventory.filter(inv=>{const item=itemDef(inv),r=rarityOf(item);return item?.category==='equipment'&&['common','uncommon'].includes(r)&&!equippedInventory(inv)&&!inv.locked;});if(!targets.length)return alert('沒有可批量處理的白色或綠色裝備。');if(!confirm(`${mode==='sell'?'出售':'分解'} ${targets.length} 件未鎖定白綠裝？`))return;let gain=0;for(const inv of targets){const item=itemDef(inv),r=rarityOf(item);if(mode==='sell'){const score=Math.max(1,Number(equipmentPowerScore?.(item))||1);gain+=Math.max(1,Math.round(score*(r==='common'?.6:1)));}else gain+=r==='common'?1:3;}const ids=new Set(targets.map(x=>x.id));gameData.inventory=gameData.inventory.filter(x=>!ids.has(x.id));if(mode==='sell')gameData.hero.gold+=gain;else gameData.hero.enhancementShards+=gain;saveGame();renderAll();alert(`已處理 ${targets.length} 件，獲得 ${gain} ${mode==='sell'?'G':'強化碎片'}。`);};
  window.equipmentProcessingHTML=function(){
    ensureEquipmentRuntimeData();
    const list=(gameData.inventory||[]).filter(inv=>itemDef(inv)?.category==='equipment');
    return `<div class="card"><h3>🔨 裝備處理</h3><div>強化碎片：<b>${gameData.hero.enhancementShards||0}</b>｜強化上限＋10</div><button class="btn gold" onclick="bulkProcessLowEquipment('sell')">批量出售白綠裝</button> <button class="btn purple" onclick="bulkProcessLowEquipment('dismantle')">批量分解白綠裝</button>${list.map(inv=>{const item=itemDef(inv),r=rarityOf(item),lv=Number(item.enhancementLevel)||0,blocked=equippedInventory(inv);return `<details class="card"><summary><b>${RARITY_LABEL[r]||r} ${escapeHtml(inv.name)} ${lv?'＋'+lv:''}</b></summary><div class="small">${equipmentStatText(item)}${blocked?'｜使用中':''}${inv.locked?'｜🔒已鎖定':''}</div><button class="btn gray" onclick="toggleEquipmentLock('${inv.id}')">${inv.locked?'解鎖':'鎖定'}</button> <button class="btn blue" onclick="enhanceEquipment('${inv.id}')" ${lv>=10?'disabled':''}>強化</button> <button class="btn gold" onclick="sellEquipment('${inv.id}')" ${blocked||inv.locked?'disabled':''}>出售</button> <button class="btn red" onclick="dismantleEquipment('${inv.id}')" ${blocked||inv.locked||r==='legendary'?'disabled':''}>分解</button></details>`;}).join('')}</div>`;
  };

  migrateInventory();saveGame();if(gameData.hero?.name)renderAll();
})();
</script>
<style>
.fx-editor{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:12px}.fx-stage{position:relative;min-height:330px;overflow:hidden;border:1px solid #59616d;border-radius:12px;background:linear-gradient(#18243a,#10151d 72%,#293326 72%);touch-action:none}.fx-stage-unit{position:absolute;bottom:30px;font-size:64px;filter:drop-shadow(0 5px 4px #0008)}.fx-stage-unit.hero{left:8%}.fx-stage-unit.enemy{right:8%}.fx-point{position:absolute;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);font-weight:900;cursor:grab;user-select:none;z-index:5;box-shadow:0 2px 8px #0009}.fx-point.start{background:#238636}.fx-point.mid{background:#8957e5}.fx-point.end{background:#da3633}.fx-preview-img{position:absolute;z-index:4;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none}.affix-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.affix-checks label{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:8px}.pool-edit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}@media(max-width:720px){.fx-editor{grid-template-columns:1fr}.fx-stage{min-height:280px}.pool-edit-grid,.affix-checks{grid-template-columns:1fr}}
</style>
<script>
/* StudyRPG V10.12.0：新學期裝備基準、技能特效工作台、完整裝備模板編輯器。 */
(function(){
  'use strict';
  const esc=window.escapeHtml||((v)=>String(v??''));
  const clone=v=>JSON.parse(JSON.stringify(v));
  const db=window.STUDYRPG_ITEM_EQUIPMENT_DB||{};
  const AFF=window.EQUIPMENT_AFFIX_DATABASE||{};
  const rarityCount={common:0,uncommon:1,rare:2,epic:3};

  /* 下一學期只在開學時記錄一次裝備，不隨換裝追漲。 */
  function equippedScore(){
    return Object.values(gameData.hero?.equipment||{}).reduce((sum,id)=>{
      const inv=(gameData.inventory||[]).find(x=>x.id===id),item=inv&&(inv.itemData||(gameData.shopItems||[]).find(x=>x.id===inv.itemId));
      return sum+(item?Number(window.equipmentPowerScore?.(item)||0):0);
    },0);
  }
  function ensureSemesterGearBaseline(){
    const cycle=Math.max(1,Number(window.currentCampaignCycle?.())||1);
    gameData.balanceSettings=gameData.balanceSettings||{};
    if(gameData.balanceSettings.gearCarryRate===undefined)gameData.balanceSettings.gearCarryRate=.55;
    if(!gameData.semesterGearBaseline||Number(gameData.semesterGearBaseline.cycle)!==cycle){
      gameData.semesterGearBaseline={cycle,equipmentScore:equippedScore(),capturedAt:new Date().toISOString()};
      saveGame();
    }
    return gameData.semesterGearBaseline;
  }
  function semesterGearBonus(){
    const cycle=Math.max(1,Number(window.currentCampaignCycle?.())||1);if(cycle<=1)return 0;
    const snap=ensureSemesterGearBaseline(),rate=Math.max(0,Math.min(1,Number(gameData.balanceSettings?.gearCarryRate)??.55));
    return Math.round(Number(snap.equipmentScore||0)*rate);
  }
  const oldCampaign=window.applyCampaignCalendarState;
  if(typeof oldCampaign==='function')window.applyCampaignCalendarState=function(){const out=oldCampaign.apply(this,arguments);ensureSemesterGearBaseline();return out;};
  const oldCalibrated=window.calibratedDailyMonsterPower;
  if(typeof oldCalibrated==='function')window.calibratedDailyMonsterPower=function(){return Math.max(1,Math.round(oldCalibrated.apply(this,arguments)+semesterGearBonus()));};
  const oldGenerated=window.generatedMonsterPower;
  if(typeof oldGenerated==='function')window.generatedMonsterPower=function(){return Math.max(1,Math.round(oldGenerated.apply(this,arguments)+semesterGearBonus()));};
  window.gmSaveGearCarryRate=function(){gameData.balanceSettings=gameData.balanceSettings||{};gameData.balanceSettings.gearCarryRate=Math.max(0,Math.min(1,Number(document.getElementById('gmGearCarryRate')?.value||55)/100));saveGame();renderGM();alert('新學期裝備折算已儲存。只使用開學快照，不會隨換裝追漲。');};
  window.gmRefreshGearBaseline=function(){const cycle=Math.max(1,Number(window.currentCampaignCycle?.())||1);gameData.semesterGearBaseline={cycle,equipmentScore:equippedScore(),capturedAt:new Date().toISOString()};saveGame();renderGM();alert('已重新記錄目前穿戴裝備，作為本學期怪物基準。');};

  /* 職業技能專屬詞條：只強化指定技能，不污染怪物詞條命名空間。 */
  const skillAffixes={
    warrior_mastery:{id:'eq:warrior_mastery',name:'戰技專精',slots:['weapon','body','accessory'],kind:'skill_boost',heroClass:'戰士',skillIds:['heavy_strike','guard_break'],multiplier:.18,power:7,text:'戰士「重擊／破甲斬」傷害＋18%'},
    mage_mastery:{id:'eq:mage_mastery',name:'元素增幅',slots:['weapon','head','accessory'],kind:'skill_boost',heroClass:'法師',skillIds:['fireball','ice_lance','thunderbolt'],multiplier:.18,power:7,text:'法師元素攻擊技能傷害＋18%'},
    priest_mastery:{id:'eq:priest_mastery',name:'聖療回聲',slots:['weapon','head','accessory'],kind:'skill_boost',heroClass:'牧師',skillIds:['holy_light','greater_heal','healing_prayer'],multiplier:.20,power:7,text:'牧師治療與聖光技能效果＋20%'},
    hunter_mastery:{id:'eq:hunter_mastery',name:'狩獵印記',slots:['weapon','head','accessory'],kind:'skill_boost',heroClass:'獵人',skillIds:['power_shot','multi_shot','aimed_shot'],multiplier:.18,power:7,text:'獵人射擊技能傷害＋18%'},
    rogue_mastery:{id:'eq:rogue_mastery',name:'暗影殺意',slots:['weapon','head','accessory'],kind:'skill_boost',heroClass:'盜賊',skillIds:['backstab','poison_blade','assassinate'],multiplier:.18,power:7,text:'盜賊攻擊技能傷害＋18%'},
    paladin_mastery:{id:'eq:paladin_mastery',name:'聖裁增幅',slots:['weapon','body','accessory'],kind:'skill_boost',heroClass:'聖騎士',skillIds:['holy_slash','judgment','divine_verdict'],multiplier:.18,power:7,text:'聖騎士神聖技能傷害＋18%'},
    spellblade_mastery:{id:'eq:spellblade_mastery',name:'魔劍共鳴',slots:['weapon','body','accessory'],kind:'skill_boost',heroClass:'魔劍士',skillIds:['enchanted_slash','arcane_blade','elemental_burst'],multiplier:.18,power:7,text:'魔劍士複合技能傷害＋18%'}
  };
  Object.values(skillAffixes).forEach(a=>{if(!Object.values(AFF).some(x=>x.id===a.id))AFF[a.id]=a;});
  function equippedSkillBoost(action){
    const cls=gameData.hero?.heroClass||'';let mult=1;
    Object.values(gameData.hero?.equipment||{}).forEach(id=>{const inv=(gameData.inventory||[]).find(x=>x.id===id),item=inv&&(inv.itemData||(gameData.shopItems||[]).find(x=>x.id===inv.itemId));(item?.affixes||[]).forEach(a=>{if(a.kind==='skill_boost'&&a.heroClass===cls&&(a.skillIds||[]).includes(action?.id))mult+=Number(a.multiplier)||0;});});
    return mult;
  }
  const oldPerform=window.performAction;
  if(typeof oldPerform==='function')window.performAction=async function(side,action){if(side!=='hero')return oldPerform.apply(this,arguments);const m=equippedSkillBoost(action);if(m===1)return oldPerform.apply(this,arguments);const copy={...action};if(Number(copy.multiplier))copy.multiplier*=m;if(copy.effect?.mods){copy.effect=clone(copy.effect);for(const k of ['heal','healing','shield'])if(Number(copy.effect.mods[k]))copy.effect.mods[k]*=m;}addBattleLog(`✨ ${action.name}受到職業專屬詞條強化！`);return oldPerform.call(this,side,copy);};

  /* 裝備模板與掉落率已移至 tools/Equipment/equipment-database.js；主程式不再提供舊獎勵池編輯器。 */

  /* 技能特效工作台。部署路徑可正式儲存；本機 PNG 只做本次分頁預覽，不再寫入 localStorage。 */
  let fxState={skillId:'fireball',start:{x:25,y:58},mid:{x:50,y:25},end:{x:75,y:58}};
  const fxSessionPreview={};
  const localFx=()=>fxSessionPreview;
  const isEphemeralFxSource=src=>/^(?:data:image\/|blob:)/i.test(String(src||''));
  function allSkills(){const beginner=typeof BEGINNER_SKILLS!=='undefined'?BEGINNER_SKILLS:[],jobs=typeof JOB_SKILL_LIBRARY!=='undefined'?JOB_SKILL_LIBRARY:{};return [...beginner,...Object.values(jobs)].filter((x,i,a)=>x?.id&&a.findIndex(y=>y.id===x.id)===i);}
  window.gmFxLoad=function(){const id=document.getElementById('gmFxSkill')?.value||fxState.skillId,cfg=(gameData.skillVisuals||{})[id]||localFx()[id]||{};fxState={skillId:id,start:cfg.start||{x:25,y:58},mid:cfg.mid||{x:50,y:25},end:cfg.end||{x:75,y:58}};renderGM();};
  function readFile(input,key){
    const f=input.files?.[0];if(!f)return;
    const all=localFx(),id=document.getElementById('gmFxSkill')?.value||fxState.skillId;
    all[id]=all[id]||{};
    const old=all[id][key];
    if(/^blob:/i.test(String(old||'')))try{URL.revokeObjectURL(old);}catch(_e){}
    const url=URL.createObjectURL(f);
    all[id][key]=url;
    const path=document.getElementById('gmFx'+key[0].toUpperCase()+key.slice(1));
    if(path)path.value=url;
    previewFx();
  }
  window.gmFxFile=(input,key)=>readFile(input,key);
  function pointDown(ev){const key=ev.currentTarget.dataset.point,stage=ev.currentTarget.parentElement;ev.currentTarget.setPointerCapture(ev.pointerId);const move=e=>{const r=stage.getBoundingClientRect();fxState[key]={x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))};ev.currentTarget.style.left=fxState[key].x+'%';ev.currentTarget.style.top=fxState[key].y+'%';};ev.currentTarget.onpointermove=move;ev.currentTarget.onpointerup=()=>{ev.currentTarget.onpointermove=null;};}
  window.gmFxBind=function(){document.querySelectorAll('.fx-point').forEach(p=>p.onpointerdown=pointDown);};
  function fxValue(id){return document.getElementById(id)?.value||'';}
  window.previewFx=async function(){const stage=document.getElementById('gmFxStage');if(!stage)return;stage.querySelectorAll('.fx-preview-img').forEach(x=>x.remove());const cast=fxValue('gmFxCast'),projectile=fxValue('gmFxProjectile'),impact=fxValue('gmFxImpact'),duration=Math.max(100,Number(fxValue('gmFxDuration'))||700),size=Math.max(16,Number(fxValue('gmFxSize'))||80);const add=src=>{if(!src)return null;const img=document.createElement('img');img.src=src;img.className='fx-preview-img';img.style.width=size+'px';img.style.height=size+'px';stage.appendChild(img);return img;};const at=(img,p)=>{if(img){img.style.left=p.x+'%';img.style.top=p.y+'%';}};const c=add(cast);at(c,fxState.start);if(c){await c.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.5)'},{opacity:1},{opacity:0}],{duration:Math.min(500,duration)}).finished.catch(()=>{});c.remove();}const p=add(projectile);at(p,fxState.start);if(p){const dx=fxState.end.x-fxState.start.x,dy=fxState.end.y-fxState.start.y,mx=fxState.mid.x-fxState.start.x,my=fxState.mid.y-fxState.start.y;await p.animate([{transform:'translate(-50%,-50%)'},{transform:`translate(calc(-50% + ${mx/100*stage.clientWidth}px),calc(-50% + ${my/100*stage.clientHeight}px))`,offset:.5},{transform:`translate(calc(-50% + ${dx/100*stage.clientWidth}px),calc(-50% + ${dy/100*stage.clientHeight}px))`}],{duration,easing:'ease-in-out'}).finished.catch(()=>{});p.remove();}const i=add(impact);at(i,fxState.end);if(i){await i.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.5)'},{opacity:1},{opacity:0,transform:'translate(-50%,-50%) scale(1.3)'}],{duration:Math.min(500,duration)}).finished.catch(()=>{});i.remove();}};
  window.gmSaveFx=function(){
    gameData.skillVisuals=gameData.skillVisuals||{};
    const id=fxValue('gmFxSkill')||fxState.skillId;
    const cast=fxValue('gmFxCast'),projectile=fxValue('gmFxProjectile'),impact=fxValue('gmFxImpact');
    if([cast,projectile,impact].some(isEphemeralFxSource)){
      alert('本機 PNG 目前只供預覽，不會塞進 Safari 儲存空間。\n請先把素材放到正式 images 路徑，再填入相對路徑後儲存。');
      return false;
    }
    gameData.skillVisuals[id]={cast,projectile,impact,duration:Math.max(100,Number(fxValue('gmFxDuration'))||700),size:Math.max(16,Number(fxValue('gmFxSize'))||80),start:fxState.start,mid:fxState.mid,end:fxState.end,path:'custom'};
    saveGame();alert('技能特效已儲存並接入正式戰鬥。');return true;
  };
  function fxEditorHTML(){const skills=allSkills(),saved=(gameData.skillVisuals||{})[fxState.skillId]||localFx()[fxState.skillId]||{};return `<div class="card"><h3>✨ 技能特效與路徑工作台</h3><div class="small">綠點＝施法位置、紫點＝路徑轉折、紅點＝命中位置。三個點都能用滑鼠或手指拖動；可分別匯入施法、飛行、命中特效PNG。</div><div class="fx-editor"><div><label>技能</label><select id="gmFxSkill" onchange="gmFxLoad()">${skills.map(s=>`<option value="${s.id}" ${s.id===fxState.skillId?'selected':''}>${esc(s.name)} (${s.id})</option>`).join('')}</select><label>施法PNG路徑</label><input id="gmFxCast" value="${esc(saved.cast||'')}"><input type="file" accept="image/png" onchange="gmFxFile(this,'cast')"><label>飛行PNG路徑</label><input id="gmFxProjectile" value="${esc(saved.projectile||'')}"><input type="file" accept="image/png" onchange="gmFxFile(this,'projectile')"><label>命中PNG路徑</label><input id="gmFxImpact" value="${esc(saved.impact||'')}"><input type="file" accept="image/png" onchange="gmFxFile(this,'impact')"><div class="grid2"><div><label>總時間(ms)</label><input id="gmFxDuration" type="number" value="${Number(saved.duration)||700}"></div><div><label>尺寸(px)</label><input id="gmFxSize" type="number" value="${Number(saved.size)||80}"></div></div><button class="btn blue" onclick="previewFx()">▶ 預覽</button> <button class="btn purple" onclick="gmSaveFx()">儲存並套用</button></div><div id="gmFxStage" class="fx-stage"><div class="fx-stage-unit hero">🧙</div><div class="fx-stage-unit enemy">👹</div>${[['start','施'],['mid','路'],['end','擊']].map(([k,t])=>`<div class="fx-point ${k}" data-point="${k}" style="left:${fxState[k].x}%;top:${fxState[k].y}%">${t}</div>`).join('')}</div></div></div>`;}

  const oldSkillCfg=window.skillVisualConfig;

<!-- STUDYRPG_STAT_RECOVERY_V2 -->
<script>
(function(){
  function srReadBackup(key){
    try{
      const x=JSON.parse(localStorage.getItem(key)||'null');
      return x?.familyData?.profiles?.length?x:null;
    }catch(e){return null}
  }
  function srProfileFromBackup(fd){
    if(!fd?.profiles?.length)return null;
    return fd.profiles.find(p=>String(p.id)===String(activeProfileId))
      || fd.profiles.find(p=>String(p?.data?.hero?.name||'')===String(gameData?.hero?.name||''))
      || null;
  }
  function srCandidates(){
    return [FAMILY_CLOUD_BACKUP_KEY,FAMILY_LAST_GOOD_BACKUP_KEY]
      .map(k=>({key:k,box:srReadBackup(k)}))
      .filter(x=>x.box)
      .map(x=>({...x,profile:srProfileFromBackup(x.box.familyData)}))
      .filter(x=>x.profile?.data?.hero?.stats)
      .sort((a,b)=>Number(b.box.savedAt||0)-Number(a.box.savedAt||0));
  }
  window.studyRPGRepairExtraStats=function(){
    const c=srCandidates();
    if(!c.length){alert('找不到更新前能力值備份；沒有修改任何資料。');return}
    const chosen=c[0], old=chosen.profile.data.hero.stats||{}, cur=gameData.hero.stats||{};
    const changes=[];
    for(const k of Object.keys(cur)){
      const now=Number(cur[k]), before=Number(old[k]);
      // 只處理「目前比備份高」的能力；絕不把能力往上補。
      if(Number.isFinite(now)&&Number.isFinite(before)&&now>before){
        changes.push([k,now,before,now-before]);
      }
    }
    if(!changes.length){alert('目前能力值沒有高於最近的更新前備份，不需要回復。');return}
    const when=chosen.box.savedAt?new Date(chosen.box.savedAt).toLocaleString():'未知時間';
    const msg='找到最近的更新前備份：'+when+'\n\n'
      +changes.map(x=>`${x[0]}：${x[1]} → ${x[2]}（回復 ${x[3]}）`).join('\n')
      +'\n\n只會回復上面列出的能力值，不動金幣、EXP、裝備、任務紀錄。確定執行？';
    if(!confirm(msg))return;
    try{
      localStorage.setItem(FAMILY_KEY+'_STAT_REPAIR_SAFETY_'+Date.now(),JSON.stringify({savedAt:Date.now(),familyData}));
    }catch(e){}
    for(const [k,now,before] of changes)gameData.hero.stats[k]=before;
    gameData.statRepairV2={repairedAt:Date.now(),backupSavedAt:Number(chosen.box.savedAt||0),changes:changes.map(x=>({stat:x[0],from:x[1],to:x[2]}))};
    saveGame();
    try{renderAll()}catch(e){}
    alert('能力值已依更新前備份回復。已另外建立修復前安全備份。');
  };
  function srAddButton(){
    if(document.getElementById('studyRPGStatRepairBtn'))return;
    const b=document.createElement('button');
    b.id='studyRPGStatRepairBtn';
    b.type='button';
    b.textContent='🛠 回復多出能力';
    b.style.cssText='position:fixed;left:10px;bottom:10px;z-index:100000;padding:9px 12px;border:1px solid #d29922;border-radius:10px;background:#2d2208;color:#ffd866;font-weight:900;box-shadow:0 3px 12px #0008';
    b.onclick=studyRPGRepairExtraStats;
    document.body.appendChild(b);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',srAddButton);
  else srAddButton();
})();
</script>


<!-- STUDYRPG_EXAM_REQUIREMENT_RECOVERY_V1 -->
<script>
(function(){
  function erRead(key){
    try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}
  }
  function erProfile(fd){
    if(!fd?.profiles?.length)return null;
    return fd.profiles.find(p=>String(p.id)===String(activeProfileId))
      ||fd.profiles.find(p=>String(p?.data?.hero?.name||'')===String(gameData?.hero?.name||''))
      ||null;
  }
  window.studyRPGRepairExamRequirements=function(){
    const boxes=[FAMILY_CLOUD_BACKUP_KEY,FAMILY_LAST_GOOD_BACKUP_KEY]
      .map(k=>({key:k,box:erRead(k)})).filter(x=>x.box?.familyData)
      .map(x=>({...x,profile:erProfile(x.box.familyData)}))
      .filter(x=>x.profile?.data?.examCompletionTargetsV101716)
      .sort((a,b)=>Number(b.box.savedAt||0)-Number(a.box.savedAt||0));
    const current=gameData.examCompletionTargetsV101716||{};
    let chosen=null,changes=[];
    for(const candidate of boxes){
      const old=candidate.profile.data.examCompletionTargetsV101716||{}, found=[];
      for(const [eventKey,cur] of Object.entries(current)){
        const prev=old[eventKey];
        if(!prev||prev.semesterStart!==cur.semesterStart||prev.examDate!==cur.examDate)continue;
        const a=Array.isArray(prev.subjectIds)?prev.subjectIds:[], b=Array.isArray(cur.subjectIds)?cur.subjectIds:[];
        if(a.length!==b.length||!a.every(id=>b.includes(id)))continue;
        for(const id of b){
          const now=Number(cur?.required?.[id]), before=Number(prev?.required?.[id]);
          if(Number.isFinite(now)&&Number.isFinite(before)&&before>now+0.001)
            found.push({eventKey,id,from:now,to:before});
        }
      }
      if(found.length){chosen=candidate;changes=found;break}
    }
    if(!chosen||!changes.length){
      alert('備份裡沒有找到比目前更高、且屬於同一場考試的原始總需求；沒有修改任何資料。');
      return;
    }
    const when=chosen.box.savedAt?new Date(chosen.box.savedAt).toLocaleString():'未知時間';
    const names=Object.fromEntries((gameData.subjects||[]).map(s=>[s.id,s.name]));
    const msg='找到更新前的考試總需求紀錄：'+when+'\n\n'
      +changes.map(x=>`${names[x.id]||x.id}：${x.from.toFixed(1)} → ${x.to.toFixed(1)}`).join('\n')
      +'\n\n只恢復上面這些「考試總需求」，不動已累積能量、任務、能力、金幣、裝備。確定恢復？';
    if(!confirm(msg))return;
    try{localStorage.setItem(FAMILY_KEY+'_EXAM_REPAIR_SAFETY_'+Date.now(),JSON.stringify({savedAt:Date.now(),familyData}))}catch(e){}
    for(const x of changes) current[x.eventKey].required[x.id]=x.to;
    gameData.examCompletionTargetsV101716=current;
    saveGame();
    try{renderAll()}catch(e){}
    alert('考試總需求已從更新前備份恢復。');
  };
  function add(){
    if(document.getElementById('studyRPGExamRepairBtn'))return;
    const b=document.createElement('button');
    b.id='studyRPGExamRepairBtn'; b.type='button';
    b.textContent='🛠 修復考試能量';
    b.style.cssText='position:fixed;right:10px;bottom:10px;z-index:100000;padding:9px 12px;border:1px solid #58a6ff;border-radius:10px;background:#0d2742;color:#dbeafe;font-weight:900;box-shadow:0 3px 12px #0008';
    b.onclick=studyRPGRepairExamRequirements; document.body.appendChild(b);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();
</script>
