function ensureAssetAudit(){
  gameData.assetAudit=gameData.assetAudit&&typeof gameData.assetAudit==='object'?gameData.assetAudit:{};
  const lc=gameData.assetAudit.lotteryCoins;
  if(!lc||typeof lc!=='object'){
    gameData.assetAudit.lotteryCoins={baseline:Number(gameData.hero?.lotteryCoins)||0,initializedAt:new Date().toISOString(),entries:[]};
  }else{
    if(!Number.isFinite(Number(lc.baseline)))lc.baseline=Number(gameData.hero?.lotteryCoins)||0;
    if(!Array.isArray(lc.entries))lc.entries=[];
  }
  const coupons=gameData.assetAudit.coupons;
  if(!coupons||typeof coupons!=='object')gameData.assetAudit.coupons={entries:[]};
  else if(!Array.isArray(coupons.entries))coupons.entries=[];
  return gameData.assetAudit;
}
function changeLotteryCoins(delta,source='system',meta={}){
  ensureAssetAudit();
  const n=Number(delta)||0;if(!n)return Number(gameData.hero.lotteryCoins)||0;
  const before=Number(gameData.hero.lotteryCoins)||0,after=Math.max(0,before+n);
  const applied=after-before;if(!applied)return after;
  gameData.hero.lotteryCoins=after;
  gameData.assetAudit.lotteryCoins.entries.push({id:uid(),at:new Date().toISOString(),date:today(),delta:applied,source,before,after,...meta});
  return after;
}
function assetAuditSummary(){
  ensureAssetAudit();
  const lc=gameData.assetAudit.lotteryCoins,entries=lc.entries||[];
  const expected=(Number(lc.baseline)||0)+entries.reduce((n,e)=>n+(Number(e.delta)||0),0);
  const actual=Number(gameData.hero?.lotteryCoins)||0;
  const requests=gameData.couponRequests||[],inventory=gameData.inventory||[];
  const approved=requests.filter(r=>r.status==='approved');
  const usedCoupons=inventory.filter(inv=>inv.status==='used'&&itemCategory(inv)==='coupon');
  const issues=[];
  approved.forEach(r=>{
    const inv=inventory.find(x=>x.id===r.inventoryId);
    if(!inv)issues.push(`${r.itemName||'兌換品'}：已核准但找不到背包項目`);
    else if(inv.status!=='used')issues.push(`${r.itemName||inv.name||'兌換品'}：申請已核准，但背包狀態為 ${inv.status||'未知'}`);
    else if(inv.usedRequestId&&inv.usedRequestId!==r.id)issues.push(`${r.itemName||inv.name||'兌換品'}：核銷申請 ID 不一致`);
  });
  usedCoupons.forEach(inv=>{
    const r=requests.find(x=>x.id===inv.usedRequestId)||requests.find(x=>x.inventoryId===inv.id&&x.status==='approved');
    if(!r)issues.push(`${inv.name||'兌換品'}：背包已使用，但找不到核准紀錄`);
  });
  return {lottery:{actual,expected,diff:actual-expected,entries:entries.length,baseline:Number(lc.baseline)||0},coupon:{approved:approved.length,used:usedCoupons.length,pending:requests.filter(r=>r.status==='pending').length,issues}};
}

  const item=gameData.shopItems.find(x=>x.id===sel?.value&&itemCategory(x)==='coupon');

  const ids=[];
  for(let i=0;i<count;i++){const inv={id:uid(),itemId:item.id,name:item.name,status:'unused',boughtDate:today(),source:'gm_backfill',backfill:true,backfillReason:reason,backfilledAt:new Date().toISOString()};gameData.inventory.push(inv);ids.push(inv.id);}

function renderBag(){
  ensureItemSystem();
  let html='<h2>🎒 背包</h2>'+equipmentPanel()+(window.equipmentProcessingHTML?.()||'')+categoryTabs('bag',bagCategoryFilter);
  const inventory=gameData.inventory||[];
  const activeItems=inventory.filter(inv=>inv.status!=='used'&&(bagCategoryFilter==='all'||itemCategory(inv)===bagCategoryFilter));
  const usedCoupons=inventory.filter(inv=>inv.status==='used'&&itemCategory(inv)==='coupon'&&(bagCategoryFilter==='all'||bagCategoryFilter==='coupon'));
  if(!activeItems.length)html+='<div class="card small">這個分類目前沒有可使用的物品。</div>';
  // 可堆疊類型只在顯示／使用層依正式物品識別聚合；inventory 仍維持每個實體物品一筆，
  // 因此既有兌換核銷、裝備 inv.id、掉落來源與舊存檔都不需要改格式。
  const renderItems=[];
  const stackable=activeItems.filter(inv=>['coupon','consumable'].includes(itemCategory(inv)));
  const individual=activeItems.filter(inv=>!['coupon','consumable'].includes(itemCategory(inv)));
  renderItems.push(...inventoryGroups(stackable),...individual.map(inv=>({inv,item:itemDefinition(inv),count:1,sources:inv.source?[inv.source]:[]})));
  renderItems.forEach(entry=>{
    const inv=entry.inv,item=itemDefinition(inv),cat=itemCategory(inv),equipped=cat==='equipment'&&Object.values(gameData.hero.equipment||{}).includes(inv.id);
    const statusText=inv.status==='pending'?'<div class="small">狀態：等待家長核准</div>':'';
    const countText=['coupon','consumable'].includes(cat)&&entry.count>1?` <span class="pill good">×${entry.count}</span>`:'';
    const sourceText=entry.sources.length>1?'多重來源':entry.sources[0]==='dungeon'?'副本掉落':entry.sources[0]==='lottery'?'抽獎':'商店';
    html+=`<div class="card"><strong>${item?.icon||'📦'} ${inv.name}</strong>${countText} <span class="pill">${ITEM_CATEGORY_LABELS[cat]||cat}</span><div class="small">來源：${sourceText}</div>${statusText}${cat==='equipment'?`<div class="item-meta">${EQUIP_SLOT_LABELS[item?.equipSlot]||'裝備'}｜${equipmentStatText(item)}</div><button class="btn ${equipped?'gray':'blue'}" onclick="equipInventory('${inv.id}')">${equipped?'卸下':'裝備'}</button>`:''}${inv.status==='unused'&&cat==='coupon'?`<button class="btn gold" onclick="requestCoupon('${inv.id}')">申請使用 1 張</button>`:''}${inv.status==='unused'&&cat==='consumable'?'<div class="small good">⚔️ 戰鬥消耗品：在戰鬥的「道具」中使用。</div>':''}</div>`;
  });
  if(usedCoupons.length){
    const rows=usedCoupons.slice().sort((a,b)=>String(b.usedDate||b.boughtDate||'').localeCompare(String(a.usedDate||a.boughtDate||''))).map(inv=>{
      const req=(gameData.couponRequests||[]).find(r=>r.id===inv.usedRequestId)||(gameData.couponRequests||[]).find(r=>r.inventoryId===inv.id&&r.status==='approved');
      const usedDate=inv.usedDate||req?.approvedDate||req?.date||'未記錄';
      return `<div class="card" style="margin:8px 0"><strong>🎟️ ${inv.name}</strong><div class="small">使用日期：${usedDate}</div></div>`;
    }).join('');
    html+=`<details class="card"><summary style="cursor:pointer;font-weight:900">🧾 已使用兌換券紀錄（${usedCoupons.length}）</summary><div style="margin-top:8px">${rows}</div></details>`;
  }
  document.getElementById('panel-bag').innerHTML=html;
}

// 掉落：評分越高越偏向裝備／商品，不再幾乎只看到金幣。
function rollDungeonDrop(rating=1){ensureItemSystem();const lotteryChance=rating===3?.10:rating===2?.05:0;if(lotteryChance>0&&Math.random()<lotteryChance){changeLotteryCoins(1,'dungeon_drop',{rating:Number(rating)||1});return {type:'lottery',label:'稀有抽獎幣 ×1',value:1};}const roll=Math.random();const itemChance=rating===3?.72:rating===2?.50:.28;if(roll<itemChance){const pool=gameData.shopItems.filter(x=>x.active&&['equipment','consumable','coupon'].includes(itemCategory(x)));if(pool.length){const weighted=pool.flatMap(i=>Array(itemCategory(i)==='equipment'?(rating===3?4:2):itemCategory(i)==='consumable'?3:2).fill(i));const item=weighted[Math.floor(Math.random()*weighted.length)];gameData.inventory.push({id:uid(),itemId:item.id,name:item.name,status:'unused',boughtDate:today(),source:'dungeon'});return {type:itemCategory(item),label:`${item.icon||'🎁'} ${item.name}`,value:item.id};}}const amount=rating===3?5+Math.floor(Math.random()*6):rating===2?3+Math.floor(Math.random()*3):1+Math.floor(Math.random()*3);gameData.hero.gold+=amount;return {type:'gold',label:`金幣 +${amount} G`,value:amount};}

// 裝備能力實際套入戰鬥數值。
const __makeHeroBattleStatsV10109=makeHeroBattleStats;
makeHeroBattleStats=function(){const u=__makeHeroBattleStatsV10109();const e=totalEquipmentStats();u.attack+=e.attack;u.magicAttack+=e.magicAttack;u.defense+=e.defense;u.magicDefense+=e.magicDefense;u.speed+=e.speed;u.maxHp+=e.maxHp;u.maxEnergy+=e.maxEnergy;u.crit=clampBattle(u.crit+e.crit,.05,.60);u.evade=clampBattle(u.evade+e.evade,.02,.50);u.block=clampBattle(u.block+e.block,.05,.45);return u;};

function runStorageDiagnostic(){
  const out=document.getElementById('storageDiagnosticResult');
  const fmt=n=>{
    n=Number(n)||0;
    if(n>=1024*1024)return (n/1024/1024).toFixed(2)+' MB';
    if(n>=1024)return (n/1024).toFixed(1)+' KB';
    return n+' B';
  };
  const rows=[];
  let total=0, readError='';
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i)||'';
      let value='';
      try{value=localStorage.getItem(key)||'';}catch(e){value='';}
      // Web Storage is UTF-16 in JS; use 2 bytes/character as a practical quota estimate.
      const bytes=(key.length+value.length)*2;
      total+=bytes; rows.push({key,bytes});
    }
  }catch(e){readError=(e?.name||'Error')+': '+String(e?.message||e);}
  rows.sort((a,b)=>b.bytes-a.bytes);
  let write='✅ 成功';
  const probe='__studyRPGStorageProbe__';
  try{localStorage.setItem(probe,'ok');localStorage.removeItem(probe);}
  catch(e){write='❌ '+(e?.name||'Error')+': '+String(e?.message||e);}
  let estimate='瀏覽器未提供';
  try{
    if(navigator.storage?.estimate){
      navigator.storage.estimate().then(est=>{
        const extra='\nSafari storage estimate：'+fmt(est.usage||0)+' / '+fmt(est.quota||0);
        if(out)out.textContent=(out.textContent||'')+extra;
      }).catch(()=>{});
    }
  }catch(_e){}
  const important=k=>/study|rpg|family|game|visual|backup|task/i.test(k);
  const lines=[
    'StudyRPG 本機儲存診斷',
    '------------------------',
    'localStorage 估算總量：'+fmt(total),
    '本次啟動已清理舊技能 PNG：'+(()=>{try{const n=Number(sessionStorage.getItem('__studyRPGStorageCleanupFreed')||0);return n>0?'✅ 釋放 '+fmt(n):'無需清理';}catch(_e){return '無法讀取';}})(),
    '測試寫入：'+write,
    readError?'讀取錯誤：'+readError:'讀取：✅ 成功',
    '',
    '各項目（由大到小）：'
  ];
  rows.slice(0,30).forEach(r=>lines.push((important(r.key)?'★ ':'  ')+r.key+'  '+fmt(r.bytes)));
  if(rows.length>30)lines.push('…其餘 '+(rows.length-30)+' 項未顯示');
  lines.push('','★ = StudyRPG/家庭/備份相關 key','注意：iOS「網站資料」46.2 MB 還包含 Cache / IndexedDB 等，不等於 localStorage 總量。');
  if(out)out.textContent=lines.join('\n');
  return {total,rows,write,readError};
}

function gmAddTask(){
  const name=document.getElementById('gmTaskName').value.trim();
  if(!name){alert('請輸入任務名稱');return;}
  const existing=gmEditingTaskId?gameData.tasks.find(x=>x.id===gmEditingTaskId):null;
  const taskType=document.getElementById('gmTaskType').value;
  const recurring=document.getElementById('gmRecurringTask')?.checked===true;
  const taskStart=document.getElementById('gmTaskStartDate')?.value||today();
  const taskEnd=document.getElementById('gmTaskEndDate')?.value||'';
  if(taskEnd&&taskEnd<taskStart){alert('結束日期不能早於開始日期');return;}
  const rewardMode=document.getElementById('gmRewardMode')?.value||'auto';
  const category=document.getElementById('gmTaskCategory')?.value||'study';
  const difficulty=document.getElementById('gmTaskDifficulty')?.value||'normal';
  let rules=[];
  const manualStat1=document.getElementById('gmFixedStat')?.value||'will';
  const manualVal1=rewardMode==='manual'?(Number(document.getElementById('gmFixedStatValue')?.value)||0):0;
  const manualStat2=document.getElementById('gmFixedStat2')?.value||'';
  const manualVal2=rewardMode==='manual'?(Number(document.getElementById('gmFixedStatValue2')?.value)||0):0;
  if(taskType==='timer'&&rewardMode==='manual'){
    const maxMinutes=Math.max(Number(document.getElementById('gmRule1Min')?.value)||0,Number(document.getElementById('gmRule2Min')?.value)||0);
    rules=[
      {maxMinutes,stat:manualStat1,value:manualVal1},
      ...(manualStat2&&manualStat2!==manualStat1?[{maxMinutes,stat:manualStat2,value:manualVal2}]:[])
    ].filter(r=>r.value!==0);
  }
  const selectedCourseId=document.getElementById('gmSubject')?.value||'';
  const selectedCourse=(familyData.examSubjects||[]).find(s=>s.id===selectedCourseId);
  const task={
    id:existing?.id||uid(),name,taskType,rewardMode,category,difficulty,
    description:document.getElementById('gmTaskDesc').value.trim(),
    courseId:selectedCourseId,
    subject:selectedCourse?.name||'',
    progressType:document.getElementById('gmProgressType').value.trim(),
    progressValue:document.getElementById('gmProgressValue').value.trim(),
    goldReward:Number(document.getElementById('gmTaskGold').value)||0,
    expReward:Number(document.getElementById('gmTaskExp').value)||0,
    dailyLimit:Math.max(1,Number(document.getElementById('gmTaskLimit').value)||1),
    active:true,archived:false,
    recurring,
    createdDate:existing?.createdDate||today(),date:recurring?'':taskStart,activeFrom:taskStart,activeUntil:taskEnd,
    countForBossOnNonSchoolDay:document.getElementById('gmBossNonSchool')?.checked||false,
    weekdays:[...document.querySelectorAll('.gmWeekday:checked')].map(x=>Number(x.value)),statRules:rules,
    fixedStat:manualStat1,
    fixedStatValue:manualVal1,
    fixedStat2:manualStat2,
    fixedStatValue2:manualVal2,
    manualStatRewards:rewardMode==='manual'?{[manualStat1]:manualVal1,...(manualStat2&&manualStat2!==manualStat1?{[manualStat2]:manualVal2}:{})}:{},
    timerMode:document.getElementById('gmTimerMode')?.value||'deadline',
    fastMinutes:Number(document.getElementById('gmRule1Min')?.value)||30,
    standardMinutes:Number(document.getElementById('gmRule2Min')?.value)||60,
    quantityTarget:Math.max(1,Number(document.getElementById('gmQuantityTarget')?.value)||1),
    quantityUnit:(document.getElementById('gmQuantityUnit')?.value||'次').trim(),
    scoreMax:Math.max(1,Number(document.getElementById('gmScoreMax')?.value)||100),
    allowCorrection:document.getElementById('gmAllowCorrection')?.checked!==false,
    correctionExp:Math.max(0,Number(document.getElementById('gmCorrectionExp')?.value)||0)
  };
  if(rewardMode==='manual'){
    const previewStat=Math.max(0,manualVal1)+Math.max(0,manualVal2);
    const br=taskBalanceReport(task.expReward,task.goldReward,previewStat);
    if(br.worst.cls==='balance-bad'&&!confirm('🔴 這組手動獎勵可能破壞數值平衡。仍要建立嗎？'))return;
  }
  if(existing)Object.assign(existing,task);else gameData.tasks.push(task);
  if(typeof window.relockAllExamBosses==='function')window.relockAllExamBosses('task-config');
  // 今日基準已鎖定時，新增加的今日任務只能向上補正，不能因刪除/退回向下重算。
  if(!existing&&typeof window.raiseDailyBalanceForAddedTaskV10115==='function')window.raiseDailyBalanceForAddedTaskV10115(task);
  if(!existing&&document.getElementById('gmAssignAll')?.checked){
    persistFamily();
    familyData.profiles.forEach(p=>{
      if(p.id===activeProfileId)return;
      migrateProfileData(p.data);
      p.data.tasks.push({...JSON.parse(JSON.stringify(task)),id:uid()});
    });
  }
  gmEditingTaskId='';
  // 先立即重繪／重置任務輸入介面，讓家長能直接設定下一個任務；存檔與雲端同步在後面進行。
  renderAll();
  saveGame();
}
function deleteTask(id){
  const t=gameData.tasks.find(x=>x.id===id);if(!t)return;
  const hasHistory=(gameData.taskRecords||[]).some(r=>r.taskId===id);
  if(hasHistory){
    if(!confirm('這個任務已有完成紀錄，將改為封存。\n封存後不再出現在任務清單，但過去核定成果會保留。'))return;
    t.archived=true;t.archivedAt=new Date().toISOString();t.activeUntil=today();t.active=false;
  }else{
    if(!confirm('刪除此任務？'))return;
    gameData.tasks=gameData.tasks.filter(x=>x.id!==id);
  }
  if(typeof window.relockAllExamBosses==='function')window.relockAllExamBosses(hasHistory?'task-archived':'task-deleted');
  saveGame();renderAll();
}
function gmToggleTaskCancellation(id){
  const t=gameData.tasks.find(x=>x.id===id);if(!t)return;
  const suggested=t.recurring===true?today():(t.date||t.activeFrom||today());
  const date=prompt('輸入要取消或恢復的日期（YYYY-MM-DD）',suggested);if(!date)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('日期格式不正確');return;}
  t.cancelledDates=Array.isArray(t.cancelledDates)?t.cancelledDates:[];
  const exists=t.cancelledDates.includes(date);
  const cancelling=!exists;
  const hasCompleted=(gameData.taskRecords||[]).some(r=>r.taskId===id&&r.date===date&&r.voluntaryChallenge!==true);
  if(cancelling&&hasCompleted){alert('這項任務當天已有完成紀錄，不能再用取消移除。若成果不合格，請在核定時選擇 0%。');return;}
  const scheduledBefore=isTaskScheduledToday(t,date);
  if(date===today()&&cancelling&&typeof window.ensureDailyBalanceSnapshotV10114==='function')window.ensureDailyBalanceSnapshotV10114();
  if(exists)t.cancelledDates=t.cancelledDates.filter(d=>d!==date);else t.cancelledDates.push(date);
  t.cancelledDates.sort();
  const scheduledAfter=isTaskScheduledToday(t,date);
  if(date===today()&&scheduledBefore!==scheduledAfter&&typeof window.adjustDailyBalanceForCancellationV101176==='function'){
    window.adjustDailyBalanceForCancellationV101176(t,scheduledAfter?'restore':'cancel');
  }
  saveGame();renderAll();alert(exists?`已恢復 ${date} 的任務`:`已取消 ${date} 的任務；當日不列入應完成需求，今日怪物戰力已同步扣回`);
}

function gmNormalProgressRawStats(week,job){
  // GM 平衡基準：模擬「正常完成平日任務」後累積的永久能力，而不是只切等級/職業。
  // 每完整週約 9 點永久能力成長；依職業核心分配，保留少量通用成長。
  const completedWeeks=Math.max(0,Number(week||1)-1), total=completedWeeks*9;
  const w={str:.25,agi:.25,int:.25,will:.25,virtue:0};
  const map={
    '戰士':{str:.55,agi:.15,int:.05,will:.25,virtue:0},
    '法師':{str:.05,agi:.10,int:.60,will:.25,virtue:0},
    '牧師':{str:.05,agi:.08,int:.17,will:.35,virtue:.35},
    '獵人':{str:.10,agi:.45,int:.30,will:.15,virtue:0},
    '盜賊':{str:.35,agi:.45,int:.05,will:.15,virtue:0},
    '聖騎士':{str:.35,agi:.08,int:.05,will:.22,virtue:.30},
    '魔劍士':{str:.38,agi:.10,int:.37,will:.15,virtue:0}
  };
  const a=map[job]||w;
  return {str:10+total*a.str,agi:10+total*a.agi,int:10+total*a.int,will:10+total*a.will,virtue:total*a.virtue};
}

// V10.10.27：GM週數測試必須走和正式事件相同的期中／期末 Power 公式。
// 過去所有週五 boss 都被誤當 midterm，但 Power 又只走週數曲線，造成「標籤是 Boss、強度卻不是考試 Boss」。
function gmTestDateForWeekDay(week,dayIndex=0){
  const start=dateOnlyBattle(gameData.semester?.startDate||OFFICIAL_LAUNCH_DATE);
  if(!start)return today();
  const d=new Date(start);
  d.setDate(d.getDate()+Math.max(0,week-1)*7+Math.max(0,Math.min(4,Number(dayIndex)||0)));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function deterministicVarianceForDate(dateStr){
  const s=String(dateStr||today()).replaceAll('-','');
  let n=0;for(const ch of s)n=(n*31+ch.charCodeAt(0))%997;
  return ((n/996)*2-1)*SEMESTER_BALANCE.dailyVariance;
}
function gmTestEncounterInfo(week,dayIndex=0,mon=null){
  const date=gmTestDateForWeekDay(week,dayIndex);
  const evt=(gameData.events||[]).find(e=>e.active!==false&&e.date===date&&(e.type==='midterm'||e.type==='final'));
  let eventType='daily';
  if(mon?.finalBoss||mon?.examBoss==='final_day1'||mon?.examBoss==='final_day2')eventType='final';
  else if(evt?.type==='final'||evt?.type==='midterm')eventType=evt.type;
  return {date,eventType,evt};
}
function gmWeekTestPower(week,dayIndex=0,mon=null){
  const info=gmTestEncounterInfo(week,dayIndex,mon);
  let basePower;
  if(info.eventType==='midterm'||info.eventType==='final'){
    // 若正式事件有人工指定 Power，測試器尊重該值；否則用正式考試公式。
    if(info.evt&&Number(info.evt.power)>0){
      basePower=Number(info.evt.power);
    }else{
      const expected=Math.max(SEMESTER_BALANCE.minPower,expectedSemesterPowerAt(info.date));
      const diff=SEMESTER_BALANCE.difficultyMultipliers.normal;
      const evtMult=SEMESTER_BALANCE.eventMultipliers[info.eventType]||1;
      basePower=Math.max(SEMESTER_BALANCE.minPower,Math.round(expected*diff*evtMult*(1+deterministicVarianceForDate(info.date))));
    }
  }else{
    const cfg=DUNGEON_GROWTH_CONFIG||{firstWeekBase:40,weeklyGrowth:.16,minPower:32};
    const weeklyBase=(cfg.firstWeekBase||40)*Math.pow(1+(cfg.weeklyGrowth||.16),Math.max(0,week-1));
    basePower=Math.max(cfg.minPower||1,Math.round(weeklyBase*weeklyEncounterFactor(dayIndex)));
  }
  return Math.max(1,Math.round(basePower*currentBattleTestMultiplier()));
}

      const statusText=user?'☁️ 已登入：'+(user.email||'匿名使用者'):'☁️ 尚未登入';
      const s=document.getElementById('cloudStatus'); if(s)s.textContent=statusText;
      const ss=document.getElementById('setupCloudStatus'); if(ss)ss.textContent=statusText;
      if(user){await pullCloud({reason:'auth',preferCloud:true,pureCloud:true});updateFamilyCloudStatus();}
    });
    return true;
  }catch(e){console.error(e);alert('Firebase 初始化失敗：'+e.message);return false;}
}

function makeFamilyCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a=new Uint32Array(8);
  crypto.getRandomValues(a);
  return Array.from(a,n=>chars[n%chars.length]).join('');
}

function cloudClone(v){return v===undefined?undefined:JSON.parse(JSON.stringify(v));}
function cloudEqual(a,b){try{return JSON.stringify(a)===JSON.stringify(b);}catch(e){return a===b;}}
function cloudArrayHasStableIds(a){return Array.isArray(a)&&a.length>0&&a.every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.id!=null);}
function mergeCloud3(base,local,remote){
  if(cloudEqual(local,base))return cloudClone(remote);
  if(cloudEqual(remote,base))return cloudClone(local);
  if(cloudEqual(local,remote))return cloudClone(local);
  if(Array.isArray(local)&&Array.isArray(remote)){
    const ba=Array.isArray(base)?base:[];
    if(cloudArrayHasStableIds(local)||cloudArrayHasStableIds(remote)||cloudArrayHasStableIds(ba)){
      const bm=new Map(ba.filter(x=>x&&x.id!=null).map(x=>[String(x.id),x]));
      const lm=new Map(local.filter(x=>x&&x.id!=null).map(x=>[String(x.id),x]));
      const rm=new Map(remote.filter(x=>x&&x.id!=null).map(x=>[String(x.id),x]));
      const order=[]; for(const a of [remote,local,ba])for(const x of a)if(x&&x.id!=null&&!order.includes(String(x.id)))order.push(String(x.id));
      const out=[];
      for(const id of order){
        const b=bm.get(id),l=lm.get(id),r=rm.get(id);
        if(l===undefined&&b!==undefined){if(r===undefined||cloudEqual(r,b))continue;out.push(cloudClone(r));continue;}
        if(r===undefined&&b!==undefined){if(l===undefined||cloudEqual(l,b))continue;out.push(cloudClone(l));continue;}
        if(l===undefined){out.push(cloudClone(r));continue;}
        if(r===undefined){out.push(cloudClone(l));continue;}
        out.push(mergeCloud3(b,l,r));
      }
      return out;
    }
    // weekdays / primitive lists etc. are one logical field; a true simultaneous conflict keeps this device's explicit edit.
    return cloudClone(local);
  }
  if(local&&remote&&typeof local==='object'&&typeof remote==='object'&&!Array.isArray(local)&&!Array.isArray(remote)){
    const b=(base&&typeof base==='object'&&!Array.isArray(base))?base:{}; const out={};
    const keys=new Set([...Object.keys(b),...Object.keys(local),...Object.keys(remote)]);
    for(const k of keys){
      const hasB=Object.prototype.hasOwnProperty.call(b,k),hasL=Object.prototype.hasOwnProperty.call(local,k),hasR=Object.prototype.hasOwnProperty.call(remote,k);
      if(!hasL&&hasB){if(!hasR||cloudEqual(remote[k],b[k]))continue;out[k]=cloudClone(remote[k]);continue;}
      if(!hasR&&hasB){if(!hasL||cloudEqual(local[k],b[k]))continue;out[k]=cloudClone(local[k]);continue;}
      if(!hasL){out[k]=cloudClone(remote[k]);continue;} if(!hasR){out[k]=cloudClone(local[k]);continue;}
      out[k]=mergeCloud3(hasB?b[k]:undefined,local[k],remote[k]);
    }
    return out;
  }
  // same field changed concurrently: the device performing the explicit save wins only that field, not the whole family document.
  return cloudClone(local);
}
function rememberCloudBaseline(f){cloudBaselineFamily=cloudClone(f||familyData);}
function applyCloudFamilyPayload(payload,localCfg,opts={}){
  const __mergeLocalHistory=!opts.pureCloud;
  const __localTaskHistoryByProfile=__mergeLocalHistory?new Map((familyData?.profiles||[]).map(p=>[String(p.id),{taskRecords:deepClone(p.data?.taskRecords||[]),taskRewardLedger:deepClone(p.data?.taskRewardLedger||{})}])):new Map();
  // 真正以雲端取代前，先保留目前本機完整備份，避免任何同步判斷失誤造成不可逆資料遺失。
  backupFamilyBeforeCloudReplace();
  if(payload?.familyData?.profiles?.length){
    familyData=payload.familyData;
    activeProfileId=familyData.profiles.some(p=>p.id===familyData.activeProfileId)
      ? familyData.activeProfileId : familyData.profiles[0].id;
    gameData=getActiveProfile().data;
    migrateProfileData(gameData);
  }else if(payload?.gameData){
    gameData=payload.gameData;migrateProfileData(gameData);
    familyData={version:10,seasonId:currentSeasonStorageId(),activeProfileId:'hero_1',
      profiles:[{id:'hero_1',label:gameData.hero?.name||'勇者 1',data:gameData}],
      access:{ownerUid:'',members:{}}};
    activeProfileId='hero_1';
  }else return false;
  const cloudTime=cloudPayloadClientUpdatedAt(payload);
  if(cloudTime>0)familyData.updatedAtClient=Math.max(Number(familyData.updatedAtClient)||0,cloudTime);
  if(!gameData.settings)gameData.settings={parentPinHash:'',cloud:{}};
  gameData.settings.cloud=localCfg||gameData.settings.cloud||{};
  sessionStorage.setItem('activeHeroProfile',activeProfileId);
  persistFamily(false);
  setCloudSyncStatus('cloud');
  
  if(__mergeLocalHistory)for(const __p of (familyData?.profiles||[])){
    const __old=__localTaskHistoryByProfile.get(String(__p.id));
    if(!__old||!__p.data)continue;
    __p.data.taskRecords=__p.data.taskRecords||[];
    const __ids=new Set(__p.data.taskRecords.map(r=>String(r?.id||'')));
    for(const __r of (__old.taskRecords||[])){
      if(__r?.id&&!__ids.has(String(__r.id))){__p.data.taskRecords.push(__r);__ids.add(String(__r.id));}
    }
    __p.data.taskRewardLedger=Object.assign({},__old.taskRewardLedger||{},__p.data.taskRewardLedger||{});
  }
  gameData=getActiveProfile().data;
  rememberCloudBaseline(familyData);

  return true;
}

function decideCloudReconciliation(payload){
  const localTime=familyClientUpdatedAt();
  const cloudTime=cloudPayloadClientUpdatedAt(payload);
  const localHasData=hasMeaningfulFamilyData();
  const cloudHasData=!!(payload?.familyData?.profiles?.length||payload?.gameData);
  if(!cloudHasData)return 'local';
  if(!localHasData)return 'cloud';
  // V10.17 升級後一律有 local timestamp；若某份舊 payload 完全沒有 client/server timestamp，寧可保護本機。
  if(!cloudTime&&localHasData)return 'local';
  if(cloudTime>localTime)return 'cloud';
  if(localTime>cloudTime)return 'local';
  return 'same';
}
function updateFamilyCloudStatus(){
  const el=document.getElementById('familyCloudStatus');
  if(!el)return;
  el.textContent=currentFamilyId
    ? '✅ 已連結家庭：'+currentFamilyId
    : (currentUser?'☁️ 已登入，但尚未加入家庭':'請先登入 Google');
}

function stopFamilyRealtime(){
  if(typeof familyRealtimeUnsub==='function'){try{familyRealtimeUnsub();}catch(e){}}
  familyRealtimeUnsub=null; familyRealtimeId='';
}
function startFamilyRealtime(){
  if(!currentUser||!db||!currentFamilyId||!fb?.fsMod?.onSnapshot)return;
  const seasonId=currentSeasonStorageId();
  if(familyRealtimeId===currentFamilyId+'|'+seasonId && familyRealtimeUnsub)return;
  stopFamilyRealtime();
  const {doc,onSnapshot}=fb.fsMod;
  familyRealtimeId=currentFamilyId+'|'+seasonId;
  familyRealtimeUnsub=onSnapshot(
    doc(db,'families',currentFamilyId,'seasons',seasonId),
    snap=>{
      if(!snap.exists()||saving||cloudSaveQueued)return;
      const redirect=String(snap.data()?.redirectSeasonId||'');
      if(redirect&&redirect!==seasonId){familyData.seasonId=redirect;stopFamilyRealtime();pullCloud({reason:'season-redirect'});return;}
      const localCfg=gameData.settings?.cloud;
      const payload=snap.data();
      const decision=decideCloudReconciliation(payload);
      if(decision==='same')return;
      // 多裝置安全規則：不能再用『哪台裝置 timestamp 較新』決定誰是主機。
      // 只要本機沒有尚未成功送出的變更，Firebase realtime 就是共享家庭的最新基準，
      // 因此手機新增任務後，iPad 會接收；iPad 修改後，手機也會接收。
      if(window.__studyRPGCloudLocalDirty){
        setCloudSyncStatus('protected','本機有尚未送出的變更；暫不以即時雲端覆蓋');
        return;
      }
      applyingRealtimeCloud=true;
      try{
        if(applyCloudFamilyPayload(payload,localCfg,{pureCloud:true})){
          cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;
          window.__studyRPGCloudLocalDirty=false;
          renderAll();
          updateFamilyCloudStatus();
        }
      }finally{applyingRealtimeCloud=false;}
    },
    err=>console.warn('家庭即時同步失敗',err)
  );
}
async function pullCloud(opts={}){
  if(!currentUser||!db||pulling)return false;
  pulling=true;
  try{
    const {doc,getDoc}=fb.fsMod;
    const localCfg=gameData.settings?.cloud;
    const preferCloud=opts.preferCloud===true || !cloudBaselineReady;
    const pureCloud=opts.pureCloud===true || preferCloud;

    // 1. 先找這個 Google 帳號是否已經加入家庭。
    currentFamilyId=await readUserFamilyId(currentUser.uid);

    // 尚未連結家庭時，檢查這個 Google Email 是否已被家庭擁有者授權。
    if(!currentFamilyId && currentUser.email){
      const invite=await readMyFamilyInvite();
      const invitedFamilyId=String(invite?.familyId||'');
      if(invitedFamilyId){
        currentFamilyId=invitedFamilyId;
        await writeUserFamilyId(currentUser.uid,currentFamilyId,'parent');
      }
    }

    // 2. 已加入家庭：登入/新 session 的第一份基準一律先採用既有雲端。
    if(currentFamilyId){
      const shared=await readFamilyCloud(currentFamilyId);
      if(shared){
        if(preferCloud){
          if(applyCloudFamilyPayload(shared,localCfg,{pureCloud})){
            cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;lastCloudPullUid=currentUser.uid;
            startFamilyRealtime();
            const ss=document.getElementById('setupCloudStatus');if(ss)ss.textContent='✅ 已以家庭雲端建立本機安全基準';
            updateFamilyCloudStatus();boot();return true;
          }
        }else{
          const decision=decideCloudReconciliation(shared);
          if(decision==='cloud' && applyCloudFamilyPayload(shared,localCfg,{pureCloud:true})){
            cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;lastCloudPullUid=currentUser.uid;
            startFamilyRealtime();updateFamilyCloudStatus();boot();return true;
          }
          if(decision==='local'){
            // 不再由 pull 自動把本機較新的資料回推。避免舊手機只因 timestamp 較新就覆蓋正確雲端。
            setCloudSyncStatus('protected','本機版本較新；等待明確的使用者存檔，不自動覆蓋雲端');
            cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;lastCloudPullUid=currentUser.uid;
            startFamilyRealtime();updateFamilyCloudStatus();return true;
          }
          if(decision==='same'){
            setCloudSyncStatus('synced');cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;lastCloudPullUid=currentUser.uid;
            startFamilyRealtime();updateFamilyCloudStatus();return true;
          }
        }
      }
    }

    // 3. 相容舊版：讀原本 users/{uid}/seasons/{學期}。
    let legacyRef=doc(db,'users',currentUser.uid,'seasons',currentSeasonStorageId());
    let legacySnap=await getDoc(legacyRef);
    if(!legacySnap.exists()&&currentSeasonStorageId()!==CURRENT_SEASON_ID){legacyRef=doc(db,'users',currentUser.uid,'seasons',CURRENT_SEASON_ID);legacySnap=await getDoc(legacyRef);}
    if(legacySnap.exists()){
      const payload=legacySnap.data();
      if(preferCloud){
        if(applyCloudFamilyPayload(payload,localCfg,{pureCloud})){
          cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;lastCloudPullUid=currentUser.uid;
          const ss=document.getElementById('setupCloudStatus');if(ss)ss.textContent='✅ 已以原有雲端建立本機安全基準';
          updateFamilyCloudStatus();boot();return true;
        }
      }else{
        const decision=decideCloudReconciliation(payload);
        if(decision==='cloud' && applyCloudFamilyPayload(payload,localCfg,{pureCloud:true})){
          cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;lastCloudPullUid=currentUser.uid;updateFamilyCloudStatus();boot();return true;
        }
        if(decision==='local'){
          setCloudSyncStatus('protected','本機版本較新；未自動覆蓋原有雲端');
          cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;lastCloudPullUid=currentUser.uid;updateFamilyCloudStatus();return true;
        }
        if(decision==='same'){
          setCloudSyncStatus('synced');cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;lastCloudPullUid=currentUser.uid;updateFamilyCloudStatus();return true;
        }
      }
    }

    // 4. 所有雲端讀取都成功且確認沒有任何角色資料，才允許建立第一份雲端存檔。
    cloudBaselineReady=true;cloudBaselineUid=currentUser.uid;
    const hasRealLocalHero=(familyData?.profiles||[]).some(p=>String(p?.data?.hero?.name||'').trim());
    if(hasRealLocalHero && opts.allowFirstUpload!==false){
      await pushCloud({firstUpload:true,skipBaselineGuard:true});
      if(currentFamilyId)startFamilyRealtime();
      const ss=document.getElementById('setupCloudStatus');if(ss)ss.textContent='✅ 已建立第一份雲端存檔';
    }else if(!hasRealLocalHero){
      const ss=document.getElementById('setupCloudStatus');if(ss)ss.textContent='☁️ 此帳號沒有角色，請建立第一個勇者或加入家庭';
    }
    updateFamilyCloudStatus();return false;
  }catch(e){
    cloudBaselineReady=false;
    console.error('讀取雲端失敗',e);
    const ss=document.getElementById('setupCloudStatus');if(ss)ss.textContent='⚠️ 雲端讀取失敗：'+String(e?.message||e);
    setCloudSyncStatus('protected','尚未取得可靠雲端基準，已禁止本機覆蓋雲端');
    return false;
  }finally{pulling=false;}
}
async function pushCloud(opts={}){
  if(!currentUser||!db)return false;
  if(saving){cloudSaveQueued=true;return true;}

  // 寫入前必須先有這個登入 session 的可靠雲端基準。
  // 若尚未讀到雲端，先讀；讀取失敗時直接禁止寫入，絕不拿舊手機資料冒險覆蓋。
  if(!opts.skipBaselineGuard && !cloudBaselineReady){
    const baseline=await pullCloud({reason:'pre-write-guard',preferCloud:true,pureCloud:true,allowFirstUpload:false});
    if(!baseline && !cloudBaselineReady){
      setCloudSyncStatus('protected','尚未取得可靠雲端基準，已阻止這次寫入');
      return false;
    }
  }

  setCloudSyncStatus('syncing');
  const hasRealHero=(familyData?.profiles||[]).some(p=>String(p?.data?.hero?.name||'').trim());
  if(!hasRealHero){console.warn('略過雲端寫入：目前沒有已建立的正式角色');return false;}
  saving=true;
  let ok=false;
  try{
    do{
      cloudSaveQueued=false;
      const {doc,setDoc,serverTimestamp}=fb.fsMod;
      try{persistFamily();}
      catch(e){
        console.error('本機儲存失敗，已停止雲端寫入',e);
        setCloudSyncStatus('protected',String(e?.message||e)+'｜雲端未被覆蓋');
        return false;
      }
      let clone=JSON.parse(JSON.stringify(familyData));
      if(currentFamilyId){
        const seasonId=currentSeasonStorageId();
        // IMPORTANT: familyData is one large Firestore field. A plain setDoc here is last-writer-wins and lets an idle iPad
        // erase a task just created on the phone. Read the latest shared family and three-way merge against the last cloud baseline first.
        const latest=await readFamilyCloud(currentFamilyId);
        if(latest?.familyData?.profiles?.length){
          clone=mergeCloud3(cloudBaselineFamily||latest.familyData,clone,latest.familyData);
          familyData=clone;
          activeProfileId=familyData.profiles.some(p=>p.id===activeProfileId)?activeProfileId:(familyData.activeProfileId||familyData.profiles[0]?.id);
          familyData.activeProfileId=activeProfileId;
          gameData=getActiveProfile().data;
          persistFamily(false);
        }
        await setDoc(doc(db,'families',currentFamilyId,'seasons',seasonId),{
          familyData:clone,updatedAtClient:Number(clone.updatedAtClient)||Date.now(),updatedAt:serverTimestamp(),updatedBy:currentUser.uid
        },{merge:true});
        rememberCloudBaseline(clone);
        const previous=familyData.campaign?.previousSeasonId;
        if(previous&&previous!==seasonId)await setDoc(doc(db,'families',currentFamilyId,'seasons',previous),{redirectSeasonId:seasonId,updatedAt:serverTimestamp(),updatedBy:currentUser.uid},{merge:true});
      }else{
        await setDoc(doc(db,'users',currentUser.uid,'seasons',currentSeasonStorageId()),{
          familyData:clone,updatedAtClient:Number(clone.updatedAtClient)||Date.now(),updatedAt:serverTimestamp()
        },{merge:true});
        rememberCloudBaseline(clone);
      }
      ok=true;
    }while(cloudSaveQueued);
    if(ok){window.__studyRPGCloudLocalDirty=false;setCloudSyncStatus('synced');}
    return ok;
  }catch(e){console.error('雲端儲存失敗',e);setCloudSyncStatus('error',String(e?.message||e));return false;}
  finally{saving=false;if(currentFamilyId&&cloudBaselineReady)startFamilyRealtime();}
}

<script>
/* ===== V10.11.1 NATURAL AWAKENING SAFETY + STRICT PARENT LOCK ===== */
(function(){
  // 每次重新載入頁面都鎖回家長後台；不再跨頁面工作階段保持解鎖。
  try{ sessionStorage.removeItem('parentUnlocked'); }catch(e){}

  const NATURAL_AWAKEN_SAFETY_DAYS=42; // 最晚第6週左右進入保險判定
  // V10.11.67：自然轉職只能由家長完成核定後觸發。
  // 完成任務時的預發能力、待核定、退回0%與自主加碼都不得推動轉職。
  let awakeningReviewGate=false;

  function approvedAwakeningRecords(){
    return (gameData.taskRecords||[]).filter(r=>
      r?.status==='completed' &&
      r.approvalStatus==='approved' &&
      taskApprovalRatio(r)>0 &&
      r.voluntaryChallenge!==true
    );
  }
  // 職業傾向只取核定後真正保留下來的能力成長；不讀目前仍預發在角色身上的待核定數值。
  jobGrowthValue=function(key){
    return approvedAwakeningRecords().reduce((sum,r)=>{
      const saved=r.approvedRewards?.statGain?.[key];
      if(Number.isFinite(Number(saved)))return sum+Math.max(0,Number(saved));
      const raw=Number(r.rollback?.statGain?.[key])||0;
      return sum+Math.max(0,Math.round(raw*taskApprovalRatio(r)));
    },0);
  };

  function formalRuleByName(name){ return (JOB_RULES||[]).find(x=>x.name===name)||null; }
  function grantFormalClassOnAwaken(cls){
    const h=gameData.hero, list=(typeof FORMAL_CLASS_SKILLS!=='undefined'&&FORMAL_CLASS_SKILLS[cls])||[];
    if(!h||!list.length)return;
    const ids=list.map(x=>x.id);
    h.knownSkills=[...new Set([...(h.knownSkills||[]),...ids])];
    h.skills=[...new Set([...(h.skills||[]),...ids])];
    // 自然轉職第一次直接裝備前4招；已有該職配置時不硬洗掉。
    const current=(h.equippedSkills||[]).filter(id=>ids.includes(id));
    if(!current.length)h.equippedSkills=ids.slice(0,4);
  }
  function strongestFallbackJob(){
    const ranked=(JOB_RULES||[]).map(j=>({j,score:blendedJobScore(j),qualified:j.kind==='dual'?dualJobQualified(j):jobCoreShare(j)>=JOB_AWAKEN_CONFIG.minCoreGrowthShare}))
      .sort((a,b)=>b.score-a.score);
    return (ranked.find(x=>x.qualified)||ranked[0]||{}).j||null;
  }
  function awakeningDiagnostic(){
    const h=gameData.hero, days=daysSinceSemesterStart(), records=approvedAwakeningRecords().length;
    const candidate=currentJobCandidate(), stable=candidate?stableCandidateWeeks(candidate.name):0;
    const safetyReady=days>=NATURAL_AWAKEN_SAFETY_DAYS&&records>=JOB_AWAKEN_CONFIG.minTaskRecords;
    let reason='';
    if(h?.jobAwakened)reason='已完成覺醒';
    else if(days<JOB_AWAKEN_CONFIG.observationDays)reason=`觀察天數不足（還差 ${JOB_AWAKEN_CONFIG.observationDays-days} 天）`;
    else if(records<JOB_AWAKEN_CONFIG.minTaskRecords)reason=`任務紀錄不足（還差 ${JOB_AWAKEN_CONFIG.minTaskRecords-records} 筆）`;

  window.gmRunNaturalAwakenTest=function(){

  reviewTaskRecord=function(recordId,ratio){

  const oldSwitchTabV1011=switchTab;

    }

  };
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      try{sessionStorage.removeItem('parentUnlocked');}catch(e){}
    }
  });

  // 強化後台診斷卡 + 自然判定按鈕。
  const renderGMV1011=renderGM;
  renderGM=function(){
    renderGMV1011();

        判定：${d.reason}<br>
        最晚覺醒保險：${NATURAL_AWAKEN_SAFETY_DAYS} 天後；候選仍不明時採目前最高成長職業
      </div>

<script>
/* V10.11.4 — MP resource source-of-truth + Mage sustain */
(function(){
  // MP上限只讀角色永久能力值，不再誤讀 battle unit 上不存在的 int/will，避免 NaN/假滿條。
  formalMaxMP=function(_battleHero,cls){
    const st=gameData?.hero?.stats||{};
    const intel=Number(st.int)||0, will=Number(st.will)||0;
    const virtue=Number(gameData?.hero?.virtue)||0, lv=Number(gameData?.hero?.level)||1;
    if(cls==='牧師') return Math.max(1,Math.round(45+lv*3+will*1.10+virtue*.80+intel*.35));
    if(cls==='聖騎士') return Math.max(1,Math.round(40+lv*2.5+will*.80+virtue*.55+intel*.25));
    return Math.max(1,Math.round(50+lv*3+intel*1.20+will*.45));
  };

  // 強制MP顯示只以 formal.mp 為唯一真值；同步舊 heroEnergy 僅為舊UI相容，不參與MP判定。
  const oldUpdateFormalResourceUI=updateFormalResourceUI;
  updateFormalResourceUI=function(){
    const f=battleStateV10?.formal;
    if(f&&f.resourceType==='mp'){
      f.maxMp=Math.max(1,Number(f.maxMp)||formalMaxMP(battleStateV10.hero,f.cls));
      f.mp=Math.max(0,Math.min(f.maxMp,Number(f.mp)||0));
      battleStateV10.hero.maxEnergy=f.maxMp;
      battleStateV10.heroEnergy=f.mp;
    }
    return oldUpdateFormalResourceUI();
  };

  // 每場開戰後再做一次MP初始化，修復舊存檔/GM切職造成的 NaN 或錯條。
  const oldRun=runBattleSequence;
  runBattleSequence=function(...args){
    const r=oldRun(...args);
    const f=battleStateV10?.formal;
    if(f&&f.resourceType==='mp'){
      f.maxMp=formalMaxMP(battleStateV10.hero,f.cls);
      f.mp=f.maxMp;
      battleStateV10.hero.maxEnergy=f.maxMp;
      battleStateV10.heroEnergy=f.mp;
      updateFormalResourceUI();
      addBattleLog(`🔵 ${f.cls} MP初始化：${f.mp}/${f.maxMp}`);
    }
    return r;
  };

  // 法師：普攻命中回20% MaxMP（原10%）。覆寫舊10%回復的差額，總計20%。
  const oldHeroVs=executeHeroAgainstTarget;
  executeHeroAgainstTarget=async function(a){
    const f=battleStateV10?.formal;
    const before=(f?.cls==='法師'&&a?.kind==='attack')?Number(f.mp||0):null;
    const r=await oldHeroVs(a);
    if(f?.cls==='法師'&&a?.kind==='attack'&&r?.damage){
      // 舊版已回10%，再補10%。
      const extra=Math.max(1,Math.round(f.maxMp*.10));
      gainFormal('mp',extra);
      addBattleLog(`🔵 魔力汲取強化：額外恢復 ${extra} MP（普攻合計20% MaxMP）。`);
    }

<script>
/* V10.11.13：恢復原始設計——怪物數值由「玩家目前戰力＋當日任務可取得成長」驅動。
   週數只決定怪物/地圖/AI/機制，不再提供任何數值倍率。 */
(function(){
  function taskAvailableTodayV10113(t){
    if(!t || t.active===false)return false;
    const td=today(), wd=new Date(td+'T12:00:00').getDay();
    if(t.date && t.date!==td)return false;
    if(t.activeFrom && td<t.activeFrom)return false;
    if(t.activeUntil && td>t.activeUntil)return false;
    if(Array.isArray(t.weekdays) && t.weekdays.length && !t.weekdays.includes(wd))return false;
    return true;
  }
  function taskExpectedStatMapV10113(t){
    if((t.rewardMode||'auto')==='auto'){
      const m=autoTaskRewards(t.category||'study',t.difficulty||'normal',t.taskType)||{};
      return {str:+m.str||0,agi:+m.agi||0,int:+m.int||0,will:+m.will||0,virtue:+m.virtue||0};
    }
    const out={str:0,agi:0,int:0,will:0,virtue:0};
    if(t.taskType==='timer' && Array.isArray(t.statRules) && t.statRules.length){
      // 預估「正常完成」而非優秀獎勵：取較保守的有效規則。
      const vals=t.statRules.filter(r=>out.hasOwnProperty(r.stat)).sort((a,b)=>(+a.value||0)-(+b.value||0));
      if(vals.length){const r=vals[Math.floor((vals.length-1)/2)];out[r.stat]+=+r.value||0;}
    }else if(out.hasOwnProperty(t.fixedStat)) out[t.fixedStat]+=+t.fixedStatValue||0;
    return out;
  }
  function todayRemainingGrowthV10113(){
    const td=today();
    const doneCount={};
    (gameData.taskRecords||[]).filter(r=>r.date===td && r.approvalStatus!=='rejected').forEach(r=>doneCount[r.taskId]=(doneCount[r.taskId]||0)+1);
    const out={str:0,agi:0,int:0,will:0,virtue:0,exp:0,tasks:0};
    for(const t of (gameData.tasks||[])){
      if(!taskAvailableTodayV10113(t))continue;
      const remaining=Math.max(0,(Math.max(1,+t.dailyLimit||1))-(doneCount[t.id]||0));
      if(!remaining)continue;
      const m=taskExpectedStatMapV10113(t);
      for(const k of ['str','agi','int','will','virtue'])out[k]+=m[k]*remaining;
      out.exp+=(+t.expReward||0)*remaining;out.tasks+=remaining;
    }
    return out;
  }
  function expectedPlayerPowerTodayV10113(){
    const now=Math.max(1,combatPower());
    const g=todayRemainingGrowthV10113();
    // combatPower 原公式：STR1.2 / AGI1.1 / INT1.0 / WILL0.8；美德不直接灌通用戰力。
    const statPower=g.str*1.2+g.agi*1.1+g.int+g.will*.8;
    // EXP 只估計可能帶來的等級成長，不讓大量 EXP 把怪物暴力灌高。
    const expPower=Math.min(8,g.exp/100*3);
    return {now,g,expected:Math.max(1,now+statPower+expPower)};
  }
  window.expectedPlayerPowerTodayV10113=expectedPlayerPowerTodayV10113;

  calibratedDailyMonsterPower=function(){
    const x=expectedPlayerPowerTodayV10113();
    const idx=Math.max(0,Math.min(4,dailyMonsterIndexForDate(today())));
    // 玩家「今天完成任務後」的預估戰力為主；普通怪低於玩家，週五 Boss 接近玩家。
    const dayFactor=[.72,.76,.80,.84,1.00][idx];
    // 只吸收尚未取得成長的 65%，讓完成任務後真的形成優勢，不會怪物同步追滿。
    const projected=x.now+(x.expected-x.now)*.65;
    return Math.max(18,Math.round(projected*dayFactor));
  };

  // 敵方資源：所有非普通攻擊技能都必須真正支付 MP；不足時 AI 不得選用。
  function enemySkillMpCostV10113(skill){
    if(!skill || skill.id==='basic_attack')return 0;
    if(Number.isFinite(+skill.mpCost))return Math.max(0,+skill.mpCost);
    if(skill.kind==='magic')return 16;
    if(skill.kind==='heal')return 20;
    if(skill.kind==='debuff')return 14;
    if(skill.kind==='buff'||skill.kind==='shield'||skill.kind==='charge')return 12;
    if(skill.kind==='summon')return 25;
    if(skill.kind==='physical' && skill.status)return 10;
    if(skill.kind==='physical' && (+skill.multiplier||1)>1.05)return 8;
    return 0;
  }
  window.enemySkillMpCostV10113=enemySkillMpCostV10113;

  const oldUsable=skillUsableByEnemy;
  skillUsableByEnemy=function(unit,entry,skill){
    if(!oldUsable(unit,entry,skill))return false;
    return (+unit.mp||0)>=enemySkillMpCostV10113(skill);
  };

  const oldTurn=performLiveEnemyTurn;
  performLiveEnemyTurn=async function(unit){
    if(!unit||unit.hp<=0||unit.alive===false)return;
    if(unit.monsterId==='goblin_king'){
      const casts=Math.min(2,Number(unit.skillUses?.goblin_summon||0));
      const hardCap=Math.max(0,100-casts*40);
      unit.maxMp=100;
      unit.mp=Math.min(Number(unit.mp??100),hardCap);
      if(casts>=2){
        unit.mp=Math.min(unit.mp,20);
      }
    }
    // 由原函式選技前很難安全插入，因此暫時包住選技函式，在選定技能時立即扣 MP。
    let picked=null;
    const oldChoose=chooseLiveEnemySkill;
    chooseLiveEnemySkill=function(u){const sk=oldChoose(u);if(u===unit)picked=sk;return sk;};
    try{
      // 在原函式真正執行技能前，利用 skillUses 尚未增加的時點由 choose 捕捉；
      // 先執行原回合，再依實際選定技能扣除。召喚技能原本已有專用25MP扣款，避免重扣。
      const before=+unit.mp||0;
      await oldTurn(unit);
      if(picked && picked.kind!=='summon'){
        const cost=enemySkillMpCostV10113(picked);
        if(cost>0){unit.mp=Math.max(0,before-cost);}
      }
      const selected=selectedBattleEnemy();
      if(selected && selected.uid===unit.uid)updateBattleResource('enemy',unit.mp??0,unit.maxMp||1);
    }finally{chooseLiveEnemySkill=oldChoose;}
  };

  // W1 是教學區：異常不是每發必中；大史萊姆回血只准一次且改為10%。
  if(MONSTER_SKILL_DATABASE.water_bullet?.status)MONSTER_SKILL_DATABASE.water_bullet.status.chance=.45;
  if(MONSTER_SKILL_DATABASE.fire_bullet?.status)MONSTER_SKILL_DATABASE.fire_bullet.status.chance=.45;
  if(MONSTER_SKILL_DATABASE.thunder_bullet?.status)MONSTER_SKILL_DATABASE.thunder_bullet.status.chance=.20;
  if(MONSTER_SKILL_DATABASE.nature_heal){MONSTER_SKILL_DATABASE.nature_heal.healMaxHp=.10;MONSTER_SKILL_DATABASE.nature_heal.maxUsesPerBattle=1;}
  const king=MONSTER_AI_DATABASE.slime_king;
  if(king){king.skills=(king.skills||[]).map(e=>e.id==='nature_heal'?{...e,weight:2,maxUses:1,threshold:.30}:e);}

  // 已死亡敵人不再接受後續 DOT / 附魔 / 連段傷害。
  const oldDamage=applyDamageToEnemy;
  applyDamageToEnemy=function(unit,damage){if(!unit||unit.hp<=0||unit.alive===false)return 0;return oldDamage(unit,damage);};

  // 聖印全域唯一保險：同一角色最多一枚 holy_seal。
  const oldAddStatus=addStatus;
  addStatus=function(unit,st){
    if(st?.type==='holy_seal' && (unit?.statuses||[]).some(x=>x.type==='holy_seal'))return unit.statuses.find(x=>x.type==='holy_seal');
    const result=oldAddStatus(unit,st);
    const harmfulTypes=['poison','burn','bleed','curse','paralysis','freeze','stun','disease','death_mark','slow','armor_break'];
    const harmful=st?.effectType==='debuff'||harmfulTypes.includes(st?.type);
    if(unit===battleStateV10?.hero && harmful)playHeroStatusVisual();
    return result;
  };
})();

<script>
/* V10.11.14：每日任務中間值浮動 + 四段核定 + 考卷 Boss 學習量
   核心原則：
   A = 今日完全不做任務時的最終戰鬥面板
   B = 今日全部排定任務100%完成後的預期最終戰鬥面板
   A＝扣回今日已取得能力的完全沒做戰力；B＝A＋今日完整任務能力。一般怪取50%，週五大怪取70%。
   當日基準建立後鎖定，80/50/0核定或刪任務都不會把怪物往下調。 */
(function(){
  const DAILY_BALANCE_POSITION=.50;
  const FRIDAY_BOSS_BALANCE_POSITION=.70;

  function taskAvailableOnV10114(t,dateStr=today()){
    if(!t||t.active===false)return false;
    if(Array.isArray(t.cancelledDates)&&t.cancelledDates.includes(dateStr))return false;
    if(t.activeFrom&&dateStr<t.activeFrom)return false;
    if(t.activeUntil&&dateStr>t.activeUntil)return false;
    // 一次性任務只屬於建立/指定當日；重複任務才看 weekdays。
    if(t.recurring!==true){
      const onceDate=t.date||t.createdDate||t.activeFrom||dateStr;
      return dateStr===onceDate;
    }
    const wd=new Date(dateStr+'T12:00:00').getDay();
    if(Array.isArray(t.weekdays)&&t.weekdays.length&&!t.weekdays.includes(wd))return false;
    return true;
  }

  function perfectTaskStatMapV10114(t){
    const out={str:0,agi:0,int:0,will:0,virtue:0};
    if((t.rewardMode||'auto')==='auto'){
      const m=autoTaskRewards(t.category||'custom',t.difficulty||'normal',t.taskType)||{};
      for(const k of Object.keys(out))out[k]=Math.max(0,Number(m[k])||0);
      return out;
    }
    if(t.taskType==='timer'&&Array.isArray(t.statRules)&&t.statRules.length){
      // 100%任務基準採「任務本身可取得的完整能力獎勵」，不預先吃計時優秀額外敏捷。
      const best={};
      for(const r of t.statRules){
        if(!Object.prototype.hasOwnProperty.call(out,r.stat))continue;
        best[r.stat]=Math.max(best[r.stat]||0,Number(r.value)||0);
      }
      Object.assign(out,best);return out;
    }
    if(Object.prototype.hasOwnProperty.call(out,t.fixedStat))out[t.fixedStat]=Math.max(0,Number(t.fixedStatValue)||0);
    if(t.fixedStat2&&Object.prototype.hasOwnProperty.call(out,t.fixedStat2))out[t.fixedStat2]=Math.max(out[t.fixedStat2]||0,Number(t.fixedStatValue2)||0);
    return out;
  }

  function panelPowerV10114(p){
    if(!p)return 1;
    // 全部來源都已是 makeHeroBattleStats() 的最終值；不再重抓 STR/INT/裝備。
    const core=(Number(p.maxHp)||0)*.04
      +(Number(p.attack)||0)*.45
      +(Number(p.magicAttack)||0)*.38
      +(Number(p.defense)||0)*.35
      +(Number(p.magicDefense)||0)*.30
      +(Number(p.speed)||0)*.25
      +(Number(p.maxEnergy)||0)*.04;
    const combatRates=100*((Number(p.crit)||0)*.08+(Number(p.evade)||0)*.06+(Number(p.block)||0)*.06);
    return Math.max(1,core+combatRates);
  }

  function addExpSilentToHeroV10114(hero,amount){
    hero.exp=(Number(hero.exp)||0)+Math.max(0,Number(amount)||0);
    hero.maxExp=Math.max(1,Number(hero.maxExp)||100);
    hero.level=Math.max(1,Number(hero.level)||1);
    while(hero.exp>=hero.maxExp){
      hero.exp-=hero.maxExp;
      hero.level++;
      hero.maxExp=Math.floor(hero.maxExp*1.2);
      Object.keys(hero.stats||{}).forEach(k=>hero.stats[k]=(Number(hero.stats[k])||0)+1);
    }
  }

  function projectedPerfectPanelV10114(dateStr=today()){
    const originalHero=gameData.hero;
    const sim=JSON.parse(JSON.stringify(originalHero));
    sim.stats=sim.stats||{str:0,agi:0,int:0,will:0};
    try{
      for(const t of (gameData.tasks||[])){
        if(!taskAvailableOnV10114(t,dateStr))continue;
        const count=Math.max(1,Number(t.dailyLimit)||1);
        const m=perfectTaskStatMapV10114(t);
        for(const k of ['str','agi','int','will'])sim.stats[k]=(Number(sim.stats[k])||0)+(Number(m[k])||0)*count;
        sim.virtue=(Number(sim.virtue)||0)+(Number(m.virtue)||0)*count;
        addExpSilentToHeroV10114(sim,(Number(t.expReward)||0)*count);
      }
      gameData.hero=sim;
      return makeHeroBattleStats();
    }finally{
      gameData.hero=originalHero;
    }
  }

  function taskCombatPowerV101171(t){
    const m=perfectTaskStatMapV10114(t);
    return Math.max(0,(Number(m.str)||0)*1.2+(Number(m.agi)||0)*1.1+(Number(m.int)||0)+(Number(m.will)||0)*.8);
  }
  function statGainCombatPowerV101171(value){
    const m=value?.gains&&typeof value.gains==='object'?value.gains:(value||{});
    return Math.max(0,(Number(m.str)||0)*1.2+(Number(m.agi)||0)*1.1+(Number(m.int)||0)+(Number(m.will)||0)*.8);
  }
  function recordCreditedPowerV101171(r){
    if(!r||r.approvalStatus==='rejected')return 0;
    if(r.approvalStatus==='pending'||r.approvalStatus==null){
      // 現行流程會先把能力暫加到面板；待核定必須視為已進入基礎，避免再估一次。
      return statGainCombatPowerV101171(r.rollback?.statGain||r.rewards?.statGain);
    }
    if(r.approvedRewards?.statGain)return statGainCombatPowerV101171(r.approvedRewards.statGain);
    return statGainCombatPowerV101171(r.rollback?.statGain||r.rewards?.statGain)*taskApprovalRatio(r);
  }
  function dailyTaskPlanV101171(dateStr=today()){
    let planned=0,credited=0,count=0;
    const creditedByTask={},recordedTaskIds=new Set();
    (gameData.taskRecords||[]).forEach(r=>{
      if(r.date!==dateStr||r.voluntaryChallenge===true)return;
      recordedTaskIds.add(r.taskId);
      creditedByTask[r.taskId]=(creditedByTask[r.taskId]||0)+recordCreditedPowerV101171(r);
    });
    for(const t of (gameData.tasks||[])){
      // 今天已有正式紀錄的任務即使稍後封存，仍屬於今天原本發布的完整區間。
      if(!taskAvailableOnV10114(t,dateStr)&&!recordedTaskIds.has(t.id))continue;
      const limit=Math.max(1,Number(t.dailyLimit)||1),unit=taskCombatPowerV101171(t);
      const taskPlanned=unit*limit;
      planned+=taskPlanned;
      credited+=Math.min(taskPlanned,Math.max(0,creditedByTask[t.id]||0));
      count+=limit;
    }
    return {planned,credited,remaining:Math.max(0,planned-credited),count};
  }
  function dailyBalancePositionV101173(dateStr=today()){
    const monster=currentWeeklyMonster(dateStr);
    return monster?.boss?FRIDAY_BOSS_BALANCE_POSITION:DAILY_BALANCE_POSITION;
  }

  function ensureDailyBalanceSnapshotV10114(){
    const td=today();
    const old=gameData.dailyBalanceV10114;
    const plan=dailyTaskPlanV101171(td),base=Math.max(1,combatPower()),position=dailyBalancePositionV101173(td);
    if(old&&old.date===td&&old.formulaVersion==='V10.11.75'&&Number.isFinite(Number(old.referencePower))){
      // 當天新增或提高任務時只准向上補強；完成、低比例核定、取消或刪除都不讓怪物往下掉。
      const previousPlan=Math.max(0,Number(old.plannedTaskPower)||0);
      if(plan.planned>previousPlan+.001){
        old.referencePower=Math.round((Number(old.referencePower)+(plan.planned-previousPlan)*position)*100)/100;
        old.plannedTaskPower=Math.round(plan.planned*100)/100;
        old.maximumTaskPower=Math.round((Number(old.maximumTaskPower||old.baseCombatPower||1)+(plan.planned-previousPlan))*100)/100;
        old.taskCount=Math.max(Number(old.taskCount)||0,plan.count);
        old.updatedAt=new Date().toISOString();old.updateReason='task-plan-increased';
        try{persistFamily();}catch(e){}
      }
      return old;
    }

    // A＝今天完全沒做的戰力；B＝A＋全部已發布任務能力。完成進度只用來還原A，不改變固定區間。
    const noTaskBase=Math.max(1,base-plan.credited);
    const remaining=Math.max(0,plan.planned-plan.credited);
    const maximum=noTaskBase+plan.planned;
    const reference=noTaskBase+(maximum-noTaskBase)*position;
    const snap={
      date:td,
      formulaVersion:'V10.11.75',
      liveCombatPowerAtLock:Math.round(base*100)/100,
      baseCombatPower:Math.round(noTaskBase*100)/100,
      noTaskBasePower:Math.round(noTaskBase*100)/100,
      maximumTaskPower:Math.round(maximum*100)/100,
      plannedTaskPower:Math.round(plan.planned*100)/100,
      creditedTaskPower:Math.round(plan.credited*100)/100,
      remainingTaskPower:Math.round(remaining*100)/100,
      taskCount:plan.count,
      referencePower:Math.round(reference*100)/100,
      balancePosition:position,
      createdAt:new Date().toISOString()
    };
    gameData.dailyBalanceV10114=snap;
    try{persistFamily();}catch(e){}
    return snap;
  }
  window.ensureDailyBalanceSnapshotV10114=ensureDailyBalanceSnapshotV10114;
  window.panelPowerV10114=panelPowerV10114;

  // 正式覆蓋 V10.11.13 的每日怪算法。期中/期末事件仍走 resolvedDungeonPower 的既有 Boss 路徑。
  calibratedDailyMonsterPower=function(){
    const snap=ensureDailyBalanceSnapshotV10114();
    return Math.max(18,Math.round(snap.referencePower));
  };

  window.adjustDailyBalanceForCancellationV101176=function(t,mode){
    if(!t||!['cancel','restore'].includes(mode))return;
    const snap=ensureDailyBalanceSnapshotV10114();
    if(!snap||snap.date!==today())return;
    if(mode==='restore'){
      // 任務已先從 cancelledDates 移除；統一公式會依增加後的完整計畫向上加回。
      ensureDailyBalanceSnapshotV10114();return;
    }
    const delta=taskCombatPowerV101171(t)*Math.max(1,Number(t.dailyLimit)||1);
    if(delta<=0)return;
    const oldPlanned=Math.max(0,Number(snap.plannedTaskPower)||0),nextPlanned=Math.max(0,oldPlanned-delta);
    const base=Math.max(1,Number(snap.baseCombatPower)||1),position=Number(snap.balancePosition)||dailyBalancePositionV101173(today());
    snap.plannedTaskPower=Math.round(nextPlanned*100)/100;
    snap.maximumTaskPower=Math.round((base+nextPlanned)*100)/100;
    snap.remainingTaskPower=Math.max(0,Math.round((Number(snap.remainingTaskPower||0)-delta)*100)/100);
    snap.referencePower=Math.round((base+nextPlanned*position)*100)/100;
    snap.taskCount=Math.max(0,(Number(snap.taskCount)||0)-Math.max(1,Number(t.dailyLimit)||1));
    snap.updatedAt=new Date().toISOString();snap.updateReason='parent-cancelled-task';
    try{persistFamily();}catch(e){}
  };

  window.dailyBalanceDebugV10114=function(){
    const s=ensureDailyBalanceSnapshotV10114();
    const livePlan=dailyTaskPlanV101171(today());
    return {...s,liveCombatPower:combatPower(),livePlannedTaskPower:Math.round(livePlan.planned*100)/100,liveCreditedTaskPower:Math.round(livePlan.credited*100)/100,monsterPower:calibratedDailyMonsterPower()};
  };

  // 舊存檔核定資料相容：approved=100%、rejected=0%。pending 保持待核定。
  (gameData.taskRecords||[]).forEach(r=>{
    if(r.approvalRatio==null&&r.approvalStatus==='approved'){r.approvalRatio=1;r.approvalPercent=100;}
    if(r.approvalRatio==null&&r.approvalStatus==='rejected'){r.approvalRatio=0;r.approvalPercent=0;}
  });

  // 頁面一載入就先建立今天的鎖定基準，避免完成任務後再倒推造成重複計算。
  ensureDailyBalanceSnapshotV10114();
})();
</script>

<script>

let calendarCloudRefreshBusy=false;

async function refreshCalendarFromCloudOnReturn(){
  if(document.visibilityState!=='visible'||calendarCloudRefreshBusy||!currentUser||!db||typeof pullCloud!=='function')return;
  const now=Date.now();
  if(now-calendarCloudRefreshAt<2500)return;
  calendarCloudRefreshAt=now; calendarCloudRefreshBusy=true;
  try{
    await pullCloud();
    renderAll();
  }catch(e){
    console.warn('calendar cloud refresh failed',e);
  }finally{
    calendarCloudRefreshBusy=false;

}
